<style>
:root{
  --navy:#17325a; --navy-2:#22406c; --navy-3:#0f2544; --navy-line:#3a5a8a;
  --red:#c8161d; --red-dark:#a32d2d; --red-tint:#fbeceb; --red-wash:#fbf6f6;
  --ink:#17325a; --muted:#8a8a84; --line:#e5e2da; --line-soft:#f0eee8;
  --amber:#ba7517; --green:#639922;
  --dry:#a8571f; --wet:#1f6fa8; --cold:#2a9d9b; --hot:#c8161d;
  --rail-w:280px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink);background:#fff;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
a{color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- gate ---------- */
.gate[hidden]{display:none!important}
.gate{position:fixed;inset:0;background:var(--navy);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px}
.gate-box{width:100%;max-width:320px;text-align:center}
.gate img{width:120px;margin-bottom:22px}
.gate p{font-size:14px;color:#c7d5e8;margin:0 0 16px}
.gate input{width:100%;background:var(--navy-2);border:1px solid var(--navy-line);border-radius:10px;
  padding:14px;color:#fff;font:inherit;font-size:17px;text-align:center}
.gate input::placeholder{color:#9fb4d4}
.gate button{width:100%;margin-top:12px;background:var(--red);color:#fff;border-radius:10px;
  padding:14px;text-align:center;font-weight:600;font-size:16px}
.gate button:active{background:var(--red-dark)}
.gate-msg{font-size:13px;color:#f4a3a3;min-height:18px;margin-top:12px}
.gate-hash{font-size:11px;color:#9fb4d4;word-break:break-all;margin-top:10px}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr) minmax(0,1fr);height:100vh;height:100dvh}
/* Past this width the list only needs enough room for a row title; everything
   else belongs to the detail pane, where the reports live. */
@media (min-width:1180px){
  .app{grid-template-columns:var(--rail-w) minmax(300px,370px) minmax(0,1fr)}
}

/* ---------- topbar (mobile only) ---------- */
.topbar{display:none;align-items:center;gap:12px;background:var(--navy);color:#fff;padding:12px 14px;
  position:sticky;top:0;z-index:40}
.topbar img{height:30px;display:block}
.bar-brand{display:block;line-height:0}
.topbar .bar-title{font-weight:600;font-size:16px;flex:1;text-align:center}
.hamb{font-size:24px;line-height:1;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:8px}
.hamb:active{background:var(--navy-2)}
.back{font-size:22px;width:40px;height:40px;display:none;align-items:center;justify-content:center;border-radius:8px}

/* ---------- rail ---------- */
.rail{background:var(--navy);color:#fff;padding:22px 16px;overflow-y:auto}
.brand{display:flex;justify-content:center;margin-bottom:20px}
.brand-link,.troon-link{display:block;border-radius:8px;transition:opacity .15s}
.brand-link:hover,.troon-link:hover{opacity:.82}
.brand-link:focus-visible,.troon-link:focus-visible{outline:2px solid #fff;outline-offset:3px}
.brand img{width:94px;height:auto;display:block}
.grp{margin-bottom:6px}
.grp-head{display:flex;align-items:center;gap:11px;width:100%;padding:13px 12px;border-radius:10px;
  font-size:15px;color:#fff;font-weight:600;border-left:3px solid transparent;letter-spacing:.2px}
.grp-head:active{background:var(--navy-2)}
.grp-head[aria-expanded="true"]{background:var(--navy-3);border-left-color:var(--red)}
.grp-head .g-dot{width:8px;height:8px;border-radius:50%;flex:none;background:#c8161d}
.grp-head .g-label{flex:1}
.grp-head .chev{transition:transform .18s;font-size:12px;color:#9fb4d4}
.grp-head[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.grp-body{padding:4px 0 6px 0;margin-left:15px;border-left:1px solid var(--navy-line)}
.grp-body[hidden]{display:none}
.grp-body .nav-item{padding:9px 12px;font-size:13.5px;color:#c7d5e8;border-radius:0 8px 8px 0;border-left:2px solid transparent;margin-left:-1px}
.grp-body .nav-item:active{background:var(--navy-2)}
.grp-body .nav-item[aria-current="true"]{background:var(--navy-3);color:#fff;border-left-color:var(--red)}
.grp-body .nav-item .dot{width:6px;height:6px}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;padding:13px 12px;border-radius:10px;
  font-size:15px;border-left:3px solid transparent;font-weight:600}
.nav-item:active{background:var(--navy-2)}
.nav-item[aria-current="true"]{background:var(--navy-3);border-left-color:var(--red)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.nav-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-count{font-size:12px;color:#9fb4d4;font-weight:400}
.nav-item[aria-current="true"] .nav-count{color:#fff}
.solo{margin-bottom:6px}
.mgmt-sep{border-top:1px solid var(--navy-line);margin:12px 0 6px}
.lock{font-size:12px}
/* Footer picks up the nav's type and left edge so the rail reads as one column
   instead of a left-aligned menu sitting on a centred block. */
.rail-foot{margin-top:20px;padding-top:16px;border-top:1px solid var(--navy-line);
  color:#c7d5e8;text-align:center}
.rail-foot a{color:#fff;text-decoration:none}
.foot-num a{border-bottom:1px solid rgba(255,255,255,.28)}
.foot-num a:hover{border-bottom-color:#fff}
.foot-grp{padding:0 8px;margin-bottom:16px}
.foot-grp:last-of-type{margin-bottom:0}
.foot-lbl{font-size:15px;font-weight:600;color:#fff;margin-bottom:3px;letter-spacing:0}

.edit-area{width:100%;min-height:80px;font:inherit;font-size:14px;line-height:1.6;border:1px solid #c3ddf4;border-radius:10px;padding:12px;color:#2c2c2a;resize:vertical}
.edit-bar{display:flex;gap:8px;margin-top:10px}
.edit-save{background:var(--red);color:#fff;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:600;border:0}

.edit-cancel{background:#fff;color:var(--ink);border:1px solid #dde3ec;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:600}
.edit-status{font-size:12px;color:var(--muted);margin-top:8px;min-height:16px}

/* ---------- queue ---------- */
.queue{border-right:1px solid #dde3ec;display:flex;flex-direction:column;min-width:0;background:#eef2f8;overflow:hidden}
.queue-head{padding:20px 26px 16px;flex:none;position:sticky;top:0;z-index:5;background:#eef2f8;border-bottom:1px solid #dde3ec;min-height:82px;box-sizing:border-box}
.queue-title{font-size:22px;font-weight:600;margin:0}
.queue-sub{font-size:13px;color:var(--muted);margin:5px 0 0}
.queue-sub a{color:var(--red-dark);font-weight:500;text-decoration:none}

/* live cart card on announcements */

.cartcard{margin:18px 26px 22px;border:1px solid #dde3ec;border-radius:14px;overflow:hidden;background:#fff}
.cartcard h3{margin:0;background:var(--navy);color:#fff;font-size:12px;letter-spacing:.7px;padding:11px 16px;font-weight:600;display:flex;align-items:center;gap:8px}
.cart-body{padding:0}
.cart-loading{color:var(--muted);font-size:13px;padding:14px 16px}
.cart-row{display:flex;align-items:center;gap:12px;padding:13px 16px}
.cart-dot{width:9px;height:9px;border-radius:50%;flex:none}
.cart-mid{flex:1;min-width:0}
.cart-course-name{font-size:12px;font-weight:700;color:var(--ink);letter-spacing:.3px}
.cart-rule-txt{font-size:14px;color:#3d3d3a;margin-top:2px;line-height:1.35}
.cart-right{text-align:right;flex:none}
.cart-pill{font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap;display:inline-block}
.cart-time{font-size:10px;color:var(--muted);margin-top:4px}
.cart-err{font-size:12px;color:var(--muted);line-height:1.6;padding:14px 16px}
.cart-err code{font-size:11px;background:#f4f2ec;padding:1px 5px;border-radius:4px;word-break:break-all;display:inline-block}
.cart-learn{padding:12px 16px 14px;border-top:1px solid #eef0f4}
.cart-learn a{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#185fa5;background:#e6f1fb;border:1px solid #c3ddf4;padding:7px 13px;border-radius:20px;text-decoration:none}
.cart-learn a:active{background:#d3e6f7}
.cart-learn a.is-active{background:#185fa5;color:#fff;border-color:#185fa5}

.tabs{display:flex;gap:22px;margin-top:16px;border-bottom:1px solid var(--line);padding:0 22px}
.tab{padding:0 0 12px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--red)}
.tab span{color:var(--muted);margin-left:5px}
.list{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:16px 26px;
  border-bottom:1px solid #e3e8f0;border-left:3px solid transparent}
.row:active{background:#e4eaf3}
.row[aria-current="true"]{background:#faeceb;border-left-color:var(--red)}
.row[aria-current="true"] .row-title{color:#17325a}
.row[aria-current="true"] .row-meta{color:#8a8a84}
.row[aria-current="true"] .row[aria-current="true"] .chev-r{color:var(--red)}
.row-main{flex:1;min-width:0}
.row-title{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.row-meta{font-size:12px;color:var(--muted);margin-top:2px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-side{text-align:right;flex:none}
.row-flag{font-size:13px;font-weight:600;display:block}
.row-age{font-size:12px;color:var(--muted);margin-top:2px;display:block}
.f-urgent{color:var(--red)} .f-high{color:var(--amber)} .f-low{color:var(--green)} .f-flat{color:var(--muted)}

.row-openpill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:#185fa5;background:#e6f1fb;border:1px solid #c3ddf4;padding:5px 12px;border-radius:20px}
.row-langs{display:inline-flex;gap:6px;align-items:center}
.lang-pill{display:inline-flex;align-items:center;font-size:12px;font-weight:600;color:#185fa5;background:#e6f1fb;border:1px solid #c3ddf4;padding:5px 11px;border-radius:20px;white-space:nowrap;cursor:pointer}
.lang-pill:active{background:#d3e6f7}
.lang-pill[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
@media (max-width:420px){ .lang-pill{padding:5px 9px;font-size:11px} }
.lang-switch{display:flex;gap:8px;margin:0 auto 14px}
.lang-switch button{flex:1;max-width:150px;padding:10px;border-radius:10px;font-size:13px;font-weight:600;border:1px solid #c3ddf4;background:#e6f1fb;color:#185fa5}
.lang-switch button[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.img-card{max-width:600px;margin:0 auto;background:#fff;border-radius:14px;overflow:hidden}
.img-card img{width:100%;height:auto;display:block;border-radius:8px;cursor:zoom-in}
.img-card.is-tall img{width:auto;max-width:100%;max-height:66vh;margin:0 auto}
.img-hint{font-size:12px;color:var(--muted);text-align:center;margin:8px 0 0}
#lightbox{position:fixed;inset:0;z-index:200;background:rgba(12,20,34,.94);display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
#lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
#lightbox .lb-close{position:absolute;top:14px;right:16px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font-size:22px;line-height:1;border:0;display:flex;align-items:center;justify-content:center}

/* ---------- detail ---------- */
.detail{background:#fff;padding:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.detail-head{position:sticky;top:0;z-index:5;background:#fff;padding:20px 26px 16px;border-bottom:1px solid #dde3ec;min-height:82px;box-sizing:border-box}
.detail-head.has-open{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}

.head-open:active{background:#e9eef6}
.head-edit{flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:9px;background:#e6f1fb;border:1px solid #c3ddf4;color:#185fa5;font-size:13px;font-weight:600;text-decoration:none;margin-top:2px;cursor:pointer}

.btn-small{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#185fa5;background:#e6f1fb;border:1px solid #c3ddf4;padding:9px 16px;border-radius:22px;text-decoration:none}

.detail-body{padding:16px 26px 26px}

/* Reports opt out of the reading-width cap: tables and charts want the room,

.dt-cols{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;align-items:stretch}

  .is-wide .dt-cols>div>.wx-h:first-child{margin-top:0}
}
.detail-title{font-size:22px;font-weight:600;margin:0;color:#17325a}
.detail-sub{font-size:13px;color:#6a7a90;margin:5px 0 0;line-height:1.5}
.card{background:#fff;border-radius:0;padding:2px 0 0;border:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#f4f6fa;border-radius:10px;padding:11px 13px}
.stat-k{font-size:10px;letter-spacing:.6px;color:var(--muted)}
.stat-v{font-size:20px;font-weight:600;margin-top:3px}
.stat-v small{font-size:11px;font-weight:400;color:var(--muted)}
.rows{margin-top:14px;font-size:14px}
.kv{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.kv-k{color:var(--muted);flex:none}
.kv-v{text-align:right}
.pill{background:var(--red-tint);color:var(--red-dark);padding:3px 10px;border-radius:6px;font-size:12px;font-weight:500}
.pill-ok{background:#eaf3de;color:#3b6d11}
.note{padding:10px 0;border-bottom:1px solid var(--line-soft);line-height:1.6}
.note .kv-k{display:block;margin-bottom:3px}
.fold{width:100%;display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line-soft);font-size:14px}
.fold-tag{font-size:12px;color:var(--muted)}
.fold-body{font-size:13px;color:var(--muted);padding:0 0 12px;border-bottom:1px solid var(--line-soft);line-height:1.6}
.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.btn{flex:1;min-width:130px;text-align:center;padding:13px;border-radius:10px;font-size:14px;font-weight:600;text-decoration:none;display:block}
.btn-primary{background:var(--red);color:#fff}
.btn-primary:active{background:var(--red-dark)}
.btn-ghost{background:#fff;color:var(--ink);border:1px solid #dde3ec;font-weight:500}
.empty{padding:36px 22px;color:var(--muted);font-size:14px}


.rich{max-width:620px;margin:6px auto 0;background:#fff;border:0;border-radius:0;padding:2px 0 0;line-height:1.6;color:#2c2c2a;font-size:14px}
.rich h4{font-size:16px;color:#17325a;margin:18px 0 8px;font-weight:600}
.rich h4:first-child{margin-top:0}
.rich p{margin:0 0 12px}
.rich ul{margin:0 0 12px;padding-left:20px}
.rich li{margin-bottom:6px}
.rich b{color:#17325a;font-weight:600}
.rich figure{margin:16px 0 6px;text-align:center}
.rich img{width:100%;max-width:420px;border-radius:12px;border:1px solid #dde3ec;display:block;margin:0 auto}
.rich figcaption{font-size:12px;color:#6a7a90;margin-top:8px}
.rich .lede{font-size:15px;color:#17325a}
.embed-card{max-width:600px;margin:6px auto 0;background:#fff;border:0;border-radius:14px;overflow:hidden}
.doc-card{max-width:600px;margin:6px auto 0;background:#fff;border:0;border-radius:14px;overflow:hidden;padding:0}
.doc-card img{width:100%;height:auto;display:block;border-radius:8px}
.doc-fallback{padding:40px 20px;text-align:center;color:var(--muted);font-size:13px}

.embed-card iframe{width:100%;border:0;display:block;background:#fff}
.embed-card.is-form iframe{height:72vh;min-height:560px}

/* ---- Year Detail report ---- */
/* ---- narrative band ---- */
.yd-band{border:1px solid #e3e8ef;border-radius:12px;
 background:linear-gradient(180deg,#fbfcfe,#f8fafc);padding:11px 15px 12px;margin:0 auto 13px}
.yd-band-top{display:flex;align-items:baseline;gap:9px;margin-bottom:8px}
.yd-band-t{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#a9a9a1}
.yd-band-w{font-size:11.5px;font-weight:600;color:var(--navy);background:#fff;
 border:1px solid #dde5ef;border-radius:999px;padding:1px 9px}
.yd-band-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.yd-bc h5{margin:0 0 5px;font-size:10.5px;font-weight:700;letter-spacing:.04em;
 display:flex;align-items:center;gap:6px}
.yd-bc.good h5{color:#5c7d47}
.yd-bc.work h5{color:#a9736f}
.yd-bc h5 i{width:5px;height:5px;border-radius:50%;display:inline-block}
.yd-bc.good h5 i{background:#7d9b6a}
.yd-bc.work h5 i{background:#bd8b8b}
.yd-bc ul{margin:0;padding-left:15px}
.yd-bc li{font-size:12.5px;line-height:1.5;color:#5f5f58;margin-bottom:3px}
.yd-bc li b{color:var(--ink);font-weight:600}
.yd-none{margin:0;font-size:12.5px;color:#a9a9a1}
@media (max-width:820px){ .yd-band-cols{grid-template-columns:1fr;gap:10px} }

.yd-r{display:grid;grid-template-columns:minmax(0,1fr) 152px 176px 152px;align-items:center;
 width:100%;border:0;background:none;font-family:inherit;padding:0;text-align:left;border-radius:8px;
 font-variant-numeric:tabular-nums}
.yd-r > *{text-align:right;padding:7px 14px}
.yd-r > *:first-child{text-align:left;padding-left:8px}
.yd-head > *{padding-top:6px;padding-bottom:8px;font-size:8.5px;font-weight:700;letter-spacing:.11em;
 text-transform:uppercase;color:#a9a9a1}
.yd-head > *.yd-a{color:var(--ink);font-size:9.5px}
button.yd-r{cursor:pointer}
button.yd-r:hover{background:#f2f5f9}
.yd-grp{margin:0}
.yd-grp.open{border:1px solid #c9d6e6;border-radius:11px;overflow:hidden;
 box-shadow:0 2px 6px rgba(23,50,90,.07);margin:7px 0 11px}
.yd-grp.open > button.yd-r{border-radius:0;background:#eaf1fa;border-bottom:1px solid #c9d6e6;
 box-shadow:inset 3px 0 0 var(--navy)}
.yd-grp.open > button.yd-r > *:first-child{padding-left:14px}
.yd-grp.open .yd-nm{font-size:16px;font-weight:700;color:var(--navy)}
.yd-grp.open > button.yd-r .yd-u .yd-n{color:#7f8a99}
.yd-grp.open > button.yd-r .yd-big .yd-n{color:var(--navy)}
.yd-nm{display:flex;align-items:center;gap:9px;font-size:15.5px;font-weight:600;color:var(--ink)}
.yd-dot{width:6px;height:6px;border-radius:50%;background:#dedbd2;flex:none}
.yd-grp.open .yd-dot{background:var(--navy);box-shadow:0 0 0 3px rgba(23,50,90,.12)}
.yd-note2{font-size:11px;font-weight:400;color:#a9a9a1}
.yd-u{line-height:1.1}
.yd-u .yd-n{display:block;font-size:15px;font-weight:400;color:#a9a9a1;white-space:nowrap}
.yd-v{display:block;font-size:10px;font-style:italic;font-weight:600;white-space:nowrap;margin-top:1px}
.yd-big .yd-n{font-size:20px;font-weight:700;color:var(--ink);letter-spacing:-.015em}
.yd-pos{color:#7d9b6a}.yd-neg{color:#bd8b8b}.yd-nil{color:#d3d1c8}
.yd-panel{display:none;padding:5px 0 7px;background:#fff}
.yd-grp.open > .yd-panel{display:block}
.yd-pl > *{padding:6px 14px}
.yd-pl > *:first-child{padding-left:30px}
.yd-pl + .yd-pl{border-top:1px solid #f2f0ea}
.yd-nm2{font-size:13.5px;font-weight:500;color:#66665e;display:flex;align-items:baseline;gap:8px}
.yd-pl .yd-n{font-size:13.5px}
.yd-pl .yd-big .yd-n{font-size:16.5px}
.yd-pl .yd-v{font-size:9.5px}
.yd-side{font-size:10px;color:#a9a9a1;font-weight:600;background:#fff;border:1px solid #e8e5dc;
 border-radius:999px;padding:1px 7px}
.yd-sub{margin:22px 0 4px;font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
 color:#a9a9a1}
.yd-grand > button.yd-r{background:#fdfaf8;cursor:default}
.yd-grand.open{border-color:#f0e2da}
.yd-grand.open > button.yd-r{background:#fdf4ef;border-bottom-color:#f0e2da;
 box-shadow:inset 3px 0 0 var(--red)}
.yd-grand.open .yd-nm{color:var(--ink)}
.yd-grand.open > button.yd-r .yd-big .yd-n{color:var(--ink)}
.yd-m{display:none}
@media (max-width:860px){
  .yd-r{grid-template-columns:minmax(0,1fr) auto}
  .yd-head,.yd-r > *:nth-child(2),.yd-r > *:nth-child(4){display:none}
  .yd-big .yd-m{display:block;font-size:10px;color:#a9a9a1;font-weight:400;margin-top:2px;
    font-style:normal;white-space:normal}
  .yd-pl > *:first-child{padding-left:16px}
}

/* ---- department matrix ---- */
/* ---- the matrix becomes a stack of cards on a phone ----
   Five money columns cannot be read at 390px, so each row turns into a card and
   every figure carries its own label from data-l. */
@media (max-width:820px){
  .mx-scroll{overflow-x:visible}
  .mx-table,.mx-sub{min-width:0;display:block;width:100%}
  .mx-table tbody,.mx-sub tbody{display:block}   /* browsers insert tbody implicitly */
  .mx-table>tr:first-child,.mx-sub>tr:first-child,
  .mx-table tbody>tr:first-child,.mx-sub tbody>tr:first-child{display:none}
  .mx-table tr,.mx-sub tr{display:block;border:1px solid var(--line);border-radius:11px;
    padding:11px 13px;margin-bottom:8px;background:#fff}
  .mx-table td,.mx-sub td{display:flex;justify-content:space-between;align-items:baseline;
    border:0;padding:5px 0;text-align:right;font-size:13.5px}
  .mx-table td::before,.mx-sub td::before{content:attr(data-l);font-size:10px;
    text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;
    text-align:left;padding-right:14px;white-space:nowrap}
  .mx-table td.l,.mx-sub td.l{display:block;text-align:left;font-size:15px;font-weight:700;
    padding:0 0 7px;margin-bottom:5px;border-bottom:1px solid var(--line-soft)}
  .mx-table td.l::before,.mx-sub td.l::before{content:none}
  .mx-noi{background:transparent!important;border-top:1px solid var(--line-soft)!important;
    margin-top:5px;padding-top:8px!important;font-weight:700}
  .mx-row.open{background:var(--red-tint)}
  .mx-row.open td{background:transparent}
  .mx-row:hover td{background:transparent}
  .mx-tot{background:#f5f6f4}
  .mx-tot td{font-weight:700}
  .mx-exp{border:0!important;padding:0!important;margin:0 0 8px!important;background:none!important}
  .mx-exp td{display:block;padding:0}
  .mx-exp td::before{content:none}
  .mx-inner{padding:0}
  .mx-note{font-size:11px}
  .mx-chev{display:none}
}

.mx-modes{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 12px}
.mx-modes button{border:1px solid #dde3ec;background:#f2f6fb;color:#185fa5;font-family:inherit;
 font-size:12px;font-weight:600;padding:7px 11px;border-radius:7px;cursor:pointer}
.mx-modes button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.mx-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.mx-table{border-collapse:collapse;width:100%;min-width:740px;font-size:13px}
.mx-table th{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
 font-weight:700;padding:5px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.mx-table th.l{text-align:left}

  .embed-card.is-form iframe{height:calc(100dvh - 54px - 82px)}
}




/* ---------- scrim for mobile drawer ---------- */
.scrim{display:none;position:fixed;inset:0;background:rgba(9,20,40,.55);z-index:45}

/* =======================================================
   MOBILE  (phones) — the 99% case
   ======================================================= */
@media (max-width:820px){
  .app{display:block;height:auto}
  .topbar{display:flex}
  .rail{position:fixed;top:0;left:0;bottom:0;width:86%;max-width:320px;z-index:50;
    transform:translateX(-100%);transition:transform .22s ease;box-shadow:0 0 40px rgba(0,0,0,.3)}
  body.nav-open .rail{transform:translateX(0)}
  body.nav-open .scrim{display:block}
  /* the mark also appears in the top bar on mobile, so keep this one compact */
  .rail .brand{margin-bottom:14px}
  .rail .brand img{width:66px}
  .queue{border-right:0;min-height:calc(100dvh - 54px)}
  .detail{display:none;position:fixed;inset:54px 0 0 0;z-index:30}
  body.show-detail .detail{display:block}
  body.show-detail .queue{display:none}
  body.show-detail .back{display:flex}
  body.show-detail .hamb{display:none}
  .chev-r{display:block}
  .detail > *{max-width:none}
  .cartcard{margin:16px 16px 4px}
  .queue-head,.tabs{padding-left:16px;padding-right:16px}
  .row{padding-left:16px;padding-right:16px}
}
</style>

/* ---- password (synchronous, self-contained) ---- */
function _sha256(ascii){
  function rr(n,x){return (x>>>n)|(x<<(32-n));}
  var m=Math,K=[],H=[],p=0,i=0,W=[],b,ab,c,d,e,f,g,hh,j,s0,s1,ch,maj,t1,t2;
  var pr=function(n){var f=m.pow(n,.5);return (f-(f|0))*0x100000000|0;};
  var primes=(function(){var a=[],n=2;while(a.length<64){var ip=1;for(var k=2;k*k<=n;k++)if(n%k===0){ip=0;break;}if(ip)a.push(n);n++;}return a;})();
  for(i=0;i<8;i++)H[i]=pr(primes[i]);
  for(i=0;i<64;i++)K[i]=(function(n){var f=m.pow(n,1/3);return (f-(f|0))*0x100000000|0;})(primes[i]);
  var words=[],asciiBitLength=ascii.length*8;
  for(i=0;i<ascii.length;i++)words[i>>2]|=ascii.charCodeAt(i)<<((3-i%4)*8);
  words[ascii.length>>2]|=0x80<<((3-ascii.length%4)*8);
  words[((ascii.length+8>>6)+1<<4)-1]=asciiBitLength;
  for(j=0;j<words.length;j+=16){
    ab=H.slice(0);
    for(i=0;i<64;i++){
      if(i<16)W[i]=words[j+i]|0;
      else{
        var w15=W[i-15],w2=W[i-2];
        s0=(rr(7,w15)^rr(18,w15)^(w15>>>3));
        s1=(rr(17,w2)^rr(19,w2)^(w2>>>10));
        W[i]=(W[i-16]+s0+W[i-7]+s1)|0;
      }
      s1=(rr(6,ab[4])^rr(11,ab[4])^rr(25,ab[4]));
      ch=(ab[4]&ab[5])^(~ab[4]&ab[6]);
      t1=(ab[7]+s1+ch+K[i]+W[i])|0;
      s0=(rr(2,ab[0])^rr(13,ab[0])^rr(22,ab[0]));
      maj=(ab[0]&ab[1])^(ab[0]&ab[2])^(ab[1]&ab[2]);
      t2=(s0+maj)|0;
      ab=[(t1+t2)|0,ab[0],ab[1],ab[2],(ab[3]+t1)|0,ab[4],ab[5],ab[6]];
    }
    for(i=0;i<8;i++)H[i]=(H[i]+ab[i])|0;
  }
  var out="";for(i=0;i<8;i++)for(var k=3;k>=0;k--)out+=((H[i]>>>(k*8))&255).toString(16).padStart(2,"0");
  return out;
}
function sha(t){ return _sha256(t); }
const STAFF_HASH="5d1b67c4f5ebfbc63dd15285fa79e490cbc37c4c479a44f8e6646e0f7d65b5da";
const MANAGER_HASH="dd56de4137951d9c92681b03416ec15f886b4482a27e3a517d32f085244cbe5d";
const store={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}};

function _tryUnlock(){
  var v=document.getElementById("pw").value.replace(/\s+/g,"");
  var msg=document.getElementById("pwMsg");
  if(v.indexOf("hash:")===0){ document.getElementById("pwHash").textContent=sha(v.slice(5)); msg.textContent="Copy the hash below into the file."; return; }
  // A manager password gets in here too, and carries the manager unlock with
  // it, so supervisors sign in once instead of twice.
  if(sha(v)===MANAGER_HASH){ store.set("wgv_ok","1"); store.set("wgv_mgr","1"); state.mgrOk=true; openApp(); }
  else if(sha(v)===STAFF_HASH){ store.set("wgv_ok","1"); openApp(); }
  else{ msg.style.color="#f4a3a3"; msg.textContent="That password isn't right. Ask your manager."; document.getElementById("pw").value=""; }
}
function openApp(){
  document.getElementById("gate").style.display="none";
  document.getElementById("gate").hidden=true;
  document.getElementById("app").hidden=false;
  document.getElementById("topbar").hidden=false;
  render();
}
function _click(){ var m=document.getElementById("pwMsg"); m.style.color="#9fb4d4"; m.textContent="Checking…"; try{ _tryUnlock(); }catch(e){ m.style.color="#f4a3a3"; m.textContent="Error: "+(e&&e.message?e.message:e); } }
document.getElementById("pwGo").addEventListener("click",_click);
document.getElementById("pw").addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); _click(); } });

  {t:"Tee sheet policy update", m:"", s:"", c:"f-flat", a:"",
   d:{sub:"Changes to how staff book and view tee times.", rich:`<p class="lede"><b>WGV Employee Play Policy Update</b> · 1/1/25</p><h4>2025 WGV employee golf procedures</h4><p>The goal of WGV management is that all employees have access to both Slammer &amp; Squire and King &amp; Bear golf courses to play in low-demand times, which does affect revenue to either course. In no way is this a guaranteed benefit of employment, but it is more of a perk of being a WGV employee. Our employee golf policies must coincide logically with our stewardship of the property and revenue responsibility to our ownership.</p><ul><li>All tee time requests must be reserved through our employee website ourWGV.org with no exceptions.</li><li>Employee tee times will not be reserved by another staff member in person, by email, or by phone.</li><li>Responses for tee time requests from the professional golf staff will be in the form of emails, texts, and phone calls.</li><li>All employee tee time day and time restrictions will be lifted. Employees can request tee times for any day or time.</li><li>Any request for more than one tee time must be approved by the Director of Golf.</li><li>All employees must always accompany their guests when on property. You may just ride along with guests and not play, but you cannot exceed more than two carts in a group. This would limit you to three guests per tee time. We will announce that when it happens.</li><li>Employees may not be part of Member play groups. Playing with a member is allowed, but being a regular in a member group could be conceived by other members as more than a perk of being an employee.</li></ul><h4>Submitting a request</h4><ul><li>Log on to ourWGV.org</li><li>Code: 0121</li><li>Click Helpful Forms &amp; Info</li><li>Click Employee Golf Request</li><li>Fill out designated information blanks</li><li>Click Submit</li><li>The professional golf staff will answer the request as soon as possible.</li><li>Employees can book tee times seven days out. The golf professional staff reserves the right to delay booking your request closer to your requested time on busy days.</li></ul><h4>Viewing the tee sheet</h4><ul><li>Log on to ourWGV.org</li><li>Click Tee Sheet &amp; Calendar</li><li>Click the link to view the tee sheet</li><li>Username: <b>ourwgv98</b></li><li>Password: <b>ArnieJack98</b></li><li>Viewing the tee sheet before you submit an employee's tee time request will expedite the whole reservation process. Employees will be able to avoid asking for times already sold and avoid busy times.</li></ul><h4>Employee guests</h4><p>WGV management encourages all employees to invite friends and family to enjoy the golf courses together. WGV extends free green fees to all employees' guests and requires only that guests pay a $35++ cart fee when riding. Employee guests could be subject to additional fees if more than one guest is brought per employee.</p>`}},

/* ---- render ---- */
const el=s=>document.querySelector(s);
const openGroups={};
const state={view:"announce",tab:"open",idx:0,mgrOk:false,turf:true,lang:"en",wx:0,park:0,course:"kb",svView:"scores",cmType:"all",cmNps:"all",cmQ:"",cmShown:25,wxView:"rain",wxCourse:"kb",finSeg:"all",finYear:"",finMetric:"noi",finDept:"__all__",finPer:"total",finTab:"year",finMode:"amt",finOpen:""};
const isMobile=()=>window.matchMedia("(max-width:820px)").matches;

function buildNav(){
  let html="";
  GROUPS.forEach((g,gi)=>{
    if(!g.label){
      g.items.forEach(i=>{ html+=navItem(i,"solo"); });
      return;
    }
    if(g.sep) html+='<div class="mgmt-sep"></div>';
    const gid="g"+gi;
    if(openGroups[gid]===undefined) openGroups[gid]=false;
    html+=`<div class="grp"><button class="grp-head" data-grp="${gid}" aria-expanded="${openGroups[gid]}"><span class="g-dot"></span><span class="g-label">${g.label}${g.locked?' <span class="lock">&#128274;</span>':""}</span><span class="chev">&#9662;</span></button>
      <div class="grp-body" data-body="${gid}" ${openGroups[gid]?"":"hidden"}>${g.items.map(i=>navItem(i,"")).join("")}</div></div>`;
  });
  el("#navHost").innerHTML=html;
  document.querySelectorAll(".grp-head").forEach(b=>b.addEventListener("click",()=>{
    const id=b.dataset.grp; openGroups[id]=!openGroups[id];
    b.setAttribute("aria-expanded",openGroups[id]);
    document.querySelector('[data-body="'+id+'"]').hidden=!openGroups[id];
  }));
  document.querySelectorAll("[data-view]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.view)));
}
function navItem(i,cls){
  const n=S[i.id]&&S[i.id].tabs?S[i.id].items.length:"";
  return `<button class="nav-item ${cls}" data-view="${i.id}" aria-current="false">
    <span class="dot" style="background:${i.dot}"></span>
    <span class="nav-label">${i.label}${i.locked?' <span class="lock">&#128274;</span>':""}</span>
    <span class="nav-count">${n}</span></button>`;
}

function go(view){
  if(MGMT.indexOf(view)>-1 && !state.mgrOk){
    const p=prompt("Management area — enter the manager password.");
    if(p===null) return;
    if(sha(p.replace(/\s+/g,""))!==MANAGER_HASH){ alert("That password isn't right."); return; }
    state.mgrOk=true;
  }
  state.view=view; state.idx=0; if(view==="announce") state.turf=true; render();
  document.body.classList.remove("nav-open");
}

function render(){
  const sec=S[state.view];
  document.querySelectorAll(".nav-item").forEach(b=>b.setAttribute("aria-current",String(b.dataset.view===state.view)));
  el("#queueTitle").textContent=sec.title;
  el("#barTitle").textContent=sec.title;
  el("#queueSub").innerHTML=sec.sub+(sec.form?' &middot; <a href="'+sec.form+'">submit new</a>':"");
  el("#cartcard").hidden = state.view!=="announce"; if(state.view==="announce") loadCart();

  const items=sec.items;
  if(!items.length){ el("#list").innerHTML='<div class="empty">Nothing here right now.</div>'; el("#detail").innerHTML=""; return; }
  if(state.idx>=items.length) state.idx=0;

  el("#list").innerHTML=items.map((i,n)=>`
    <button class="row" data-idx="${n}" aria-current="${n===state.idx}">
      <span class="row-main"><span class="row-title">${i.t}</span>${i.m?`<span class="row-meta">${i.m}</span>`:""}</span>
      <span class="row-side">${i.linkOnly?`<span class="row-openpill">Open <span aria-hidden="true">&#8599;</span></span>`:`<span class="row-flag ${i.c}">${i.s||""}</span><span class="row-age">${i.a||""}</span>`}</span>
      ${i.linkOnly?"":`<span class="chev-r">&#8250;</span>`}
    </button>`).join("");
  document.querySelectorAll(".row").forEach(r=>r.addEventListener("click",(ev)=>{
    if(ev.target.closest(".row-openpill")) return; // pill handles its own click
    if(ev.target.closest(".lang-pill")) return;    // language pills handle their own click
    state.idx=+r.dataset.idx; state.turf=false; markTurf(false); detail(items[state.idx]);
    document.querySelectorAll(".row").forEach(x=>x.setAttribute("aria-current",String(+x.dataset.idx===state.idx)));
    if(isMobile()) document.body.classList.add("show-detail");
  }));
  document.querySelectorAll(".row-openpill").forEach(pill=>pill.addEventListener("click",(ev)=>{
    ev.stopPropagation();
    const it=items[+pill.closest(".row").dataset.idx];
    window.open(it.d.url,"_blank","noopener");
  }));
  document.querySelectorAll(".lang-pill").forEach(pill=>{
    const pick=(ev)=>{
      ev.stopPropagation(); ev.preventDefault();
      state.idx=+pill.closest(".row").dataset.idx;
      state.lang=pill.dataset.lang;
      state.turf=false; markTurf(false);
      detail(items[state.idx]);
      document.querySelectorAll(".row").forEach(x=>x.setAttribute("aria-current",String(+x.dataset.idx===state.idx)));
      document.querySelectorAll(".lang-pill").forEach(p=>p.setAttribute("aria-pressed",
        String(+p.closest(".row").dataset.idx===state.idx && p.dataset.lang===state.lang)));
      if(isMobile()) document.body.classList.add("show-detail");
    };
    pill.addEventListener("click",pick);
    pill.addEventListener("keydown",(e)=>{ if(e.key==="Enter"||e.key===" ") pick(e); });
  });
  if(state.view==="announce" && state.turf){ renderTurfDetail(); markTurf(true); document.querySelectorAll(".row").forEach(x=>x.setAttribute("aria-current","false")); }
  else detail(items[state.idx]);
}

function detail(i){
  const d=i.d||{};
  if(i.langs){ detailLang(i); return; }
  if(i.langDocs){ detailLangDocs(i); return; }
  if(i.fin){ detailFinancials(i); return; }
  if(i.histwx){ detailHistWx(i); return; }
  if(i.surveys){ (state.svView==="comments"?detailComments:detailSurveys)(i); return; }
  if(i.imgTabs){ detailImgTabs(i); return; }
  if(i.embedTabs){ detailEmbedTabs(i); return; }
  if(i.embedHtml){ detailEmbedHtml(i); return; }
  if(i.imgOnly){ detailImg(i); return; }
  if(i.linkOnly){
    el("#detail").innerHTML=
      `<div class="detail-head"><div class="detail-title">${i.t}</div>`+
      `<div class="detail-sub">${d.sub||"&nbsp;"}</div>`+`</div>`+
      `<div class="detail-body"><a class="btn-small" href="${d.url}" target="_blank" rel="noopener">Open <span aria-hidden="true">&#8599;</span></a></div>`;
    return;
  }
  if(d.rich){
    const canEdit=isEditableContent(i);
    const head = canEdit
      ? `<div class="detail-head has-open"><div class="dh-text"><div class="detail-title">${i.t}</div>`+
        `<div class="detail-sub">${d.sub||"&nbsp;"}</div></div>`+
        `<button type="button" class="head-edit" id="editThis"><span aria-hidden="true">&#9998;</span> Edit</button></div>`
      : `<div class="detail-head"><div class="detail-title">${i.t}</div><div class="detail-sub">${d.sub||"&nbsp;"}</div></div>`;
    el("#detail").innerHTML = head+`<div class="detail-body"><article class="rich">${d.rich}</article></div>`;
    if(canEdit){ const b=el("#editThis"); if(b) b.addEventListener("click",()=>startEdit(i)); }
    return;
  }
  const isFormItem = d.url && d.url.indexOf("docs.google.com/forms")>-1;
  const isDriveFile = d.url && /drive\.google\.com\/file\/d\//.test(d.url);
  const isPdfLink = d.url && (/\.pdf($|\?)/i.test(d.url) || isDriveFile);
  const embedItem = isFormItem || isPdfLink;
  if(embedItem){
    const m=d.url.match(/drive\.google\.com\/file\/d\/([^/]+)/);
    if(isPdfLink && m){
      // Render the PDF's first page as a clean image (no viewer chrome / black bg).
      const img="https://drive.google.com/thumbnail?id="+m[1]+"&sz=w1600";
      el("#detail").innerHTML=
        `<div class="detail-head has-open"><div class="dh-text"><div class="detail-title">${i.t}</div>`+
        `<div class="detail-sub">${d.sub||"&nbsp;"}</div>`+`</div><a class="head-open" href="${d.url}" target="_blank" rel="noopener" title="Open in new tab" aria-label="Open in new tab">&#8599;</a></div>`+
        `<div class="detail-body"><div class="doc-card"><img src="${img}" alt="${i.t}" onerror="this.parentNode.innerHTML='<div class=\\'doc-fallback\\'>Preview unavailable. Use the button in the corner to open it.</div>'"></div></div>`;
      return;
    }
    // Forms: interactive, must stay an embed.
    let src = d.url.indexOf("?")>-1 ? d.url+"&embedded=true" : d.url+"?embedded=true";
    el("#detail").innerHTML=
      `<div class="detail-head has-open"><div class="dh-text"><div class="detail-title">${i.t}</div>`+
      `<div class="detail-sub">${d.sub||"&nbsp;"}</div>`+`</div><a class="head-open" href="${d.url}" target="_blank" rel="noopener" title="Open in new tab" aria-label="Open in new tab">&#8599;</a></div>`+
      `<div class="detail-body form-body"><div class="embed-card is-form"><iframe src="${src}" title="${i.t}" loading="lazy" allow="autoplay"></iframe></div></div>`;
    return;
  }
    let html=`<div class="detail-head"><div class="detail-title">${i.t}</div><div class="detail-sub">${d.sub||"&nbsp;"}</div></div><div class="detail-body"><div class="card">`;
  if(d.stats) html+=`<div class="stats">${d.stats.map(s=>`<div class="stat"><div class="stat-k">${s[0]}</div><div class="stat-v"${s[3]?' style="color:var(--red-dark)"':""}>${s[1]}${s[2]?` <small>${s[2]}</small>`:""}</div></div>`).join("")}</div>`;
  if(d.kv||d.note||d.folds){
    html+=`<div class="rows">`;
    if(d.kv) html+=d.kv.map(k=>`<div class="kv"><span class="kv-k">${k[0]}</span><span class="kv-v">${k[2]?`<span class="pill ${k[2]==="ok"?"pill-ok":""}">${k[1]}</span>`:k[1]}</span></div>`).join("");
    if(d.note) html+=`<div class="note"><span class="kv-k">Notes</span>${d.note}</div>`;
    if(d.folds) html+=d.folds.map((f,n)=>`<button class="fold" data-fold="${n}" aria-expanded="false"><span>&rsaquo; ${f[0]}</span><span class="fold-tag">${f[1]}</span></button><div class="fold-body" data-body="${n}" hidden>${f[2]}</div>`).join("");
    html+=`</div>`;
  }
  const acts=d.actions||(d.url!==undefined?[["Open","primary"]]:[]);
  if(acts.length) html+=`<div class="actions">${acts.map(a=>a[0]==="Open"&&!d.url?`<button class="btn btn-ghost" disabled style="opacity:.55">Link not set</button>`:`<a class="btn btn-${a[1]}" href="${d.url||"#"}" target="_blank" rel="noopener">${a[0]}</a>`).join("")}</div>`;
  html+=`</div>`;
  const detailEl=el("#detail");
  detailEl.innerHTML=html;
  document.querySelectorAll(".fold").forEach(f=>f.addEventListener("click",()=>{
    const b=document.querySelector('[data-body="'+f.dataset.fold+'"]'); const o=b.hidden; b.hidden=!o; f.setAttribute("aria-expanded",String(o));
  }));
}


/* ---------- bilingual image items (Troon values / mission & vision) ---------- */
function detailLang(i){
  const L=i.langs;
  const k=(state.lang==="es")?"es":"en";
  const pane=L[k];
  el("#detail").innerHTML=
    `<div class="detail-head"><div class="detail-title">${i.t}</div>`+
    `<div class="detail-sub">${L.sub||"&nbsp;"}</div></div>`+
    `<div class="detail-body">`+
      `<div class="lang-switch">${["en","es"].map(x=>`<button type="button" data-pick="${x}" aria-pressed="${x===k}">${L[x].label}</button>`).join("")}</div>`+
      `<div class="img-card"><img src="${TROON_IMG[pane.img]}" alt="${pane.alt}"></div>`+
      `<p class="img-hint">Tap the image to view it full screen.</p>`+
    `</div>`;
  el("#detail").querySelectorAll("[data-pick]").forEach(b=>b.addEventListener("click",()=>{
    state.lang=b.dataset.pick;
    detail(i);
    document.querySelectorAll(".lang-pill").forEach(p=>p.setAttribute("aria-pressed",
      String(+p.closest(".row").dataset.idx===state.idx && p.dataset.lang===state.lang)));
  }));
  const img=el("#detail").querySelector(".img-card img");
  if(img) img.addEventListener("click",()=>openLightbox(img.src,img.alt));
}

/* ---------- bilingual PDF items (e.g. Employee Handbook) ---------- */
function detailLangDocs(i){
  const L=i.langDocs;
  const k=(state.lang==="es")?"es":"en";
  const pane=L[k];
  const m=(pane.url||"").match(/drive\.google\.com\/file\/d\/([^/]+)/);
  const thumb=m?"https://drive.google.com/thumbnail?id="+m[1]+"&sz=w1600":"";
  el("#detail").innerHTML=
    `<div class="detail-head has-open"><div class="dh-text"><div class="detail-title">${i.t}</div>`+
    `<div class="detail-sub">${L.sub||"&nbsp;"}</div></div>`+
    `<a class="head-open" href="${pane.url}" target="_blank" rel="noopener" title="Open in new tab" aria-label="Open in new tab">&#8599;</a></div>`+
    `<div class="detail-body">`+
      `<div class="lang-switch">${["en","es"].map(x=>`<button type="button" data-pick="${x}" aria-pressed="${x===k}">${L[x].label}</button>`).join("")}</div>`+
      (thumb?`<div class="doc-card"><img src="${thumb}" alt="${pane.alt||i.t}" onerror="this.parentNode.innerHTML='<div class=\\'doc-fallback\\'>Preview unavailable. Use the button below to open it.</div>'"></div>`:"")+
      `<div class="actions"><a class="btn btn-primary" href="${pane.url}" target="_blank" rel="noopener">${pane.open||"Open"}</a></div>`+
    `</div>`;
  el("#detail").querySelectorAll("[data-pick]").forEach(b=>b.addEventListener("click",()=>{
    state.lang=b.dataset.pick;
    detail(i);
    document.querySelectorAll(".lang-pill").forEach(p=>p.setAttribute("aria-pressed",
      String(+p.closest(".row").dataset.idx===state.idx && p.dataset.lang===state.lang)));
  }));
}

/* ---------- items with more than one embedded page (e.g. Weather Stations) ---------- */
function detailEmbedTabs(i){
  const d=i.embedTabs||{};
  const tabs=d.tabs||[];
  if(!tabs.length) return;
  const n=Math.min(Math.max(state.wx|0,0),tabs.length-1);
  const cur=tabs[n];
  el("#detail").innerHTML=
    `<div class="detail-head has-open"><div class="dh-text"><div class="detail-title">${i.t}</div>`+
    `<div class="detail-sub">${d.sub||"&nbsp;"}</div></div>`+
    `<a class="head-open" href="${cur[1]}" target="_blank" rel="noopener" title="Open in new tab" aria-label="Open in new tab">&#8599;</a></div>`+
    `<div class="detail-body">`+
      (tabs.length>1?`<div class="lang-switch wide">${tabs.map((t,x)=>`<button type="button" data-wx="${x}" aria-pressed="${x===n}">${t[0]}</button>`).join("")}</div>`:"")+
      `<div class="embed-card is-wx"><iframe src="${cur[1]}" title="${cur[0]}" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></div>`+
      `<p class="embed-note">Not loading? <a href="${cur[1]}" target="_blank" rel="noopener">Open ${cur[0]} in a new tab <span aria-hidden="true">&#8599;</span></a></p>`+
    `</div>`;
  el("#detail").querySelectorAll("[data-wx]").forEach(b=>b.addEventListener("click",()=>{
    state.wx=+b.dataset.wx;
    detail(i);
  }));
}

/* ---------- script-based widgets that can't be framed by URL (e.g. Tockify) ---------- */
function detailEmbedHtml(i){
  const d=i.embedHtml||{};
  const page='<!doctype html><html><head><meta charset="utf-8">'+
    '<meta name="viewport" content="width=device-width,initial-scale=1">'+
    '<style>html,body{margin:0;padding:0;background:#fff;color:#17325a;'+
    'font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}'+
    (d.css||"")+'</style>'+
    '</head><body>'+(d.html||"")+'</body></html>';
  const srcdoc=page.replace(/&/g,"&amp;").replace(/"/g,"&quot;");
  el("#detail").innerHTML=
    `<div class="detail-head has-open"><div class="dh-text"><div class="detail-title">${i.t}</div>`+
    `<div class="detail-sub">${d.sub||"&nbsp;"}</div></div>`+
    (d.url?`<a class="head-open" href="${d.url}" target="_blank" rel="noopener" title="Open in new tab" aria-label="Open in new tab">&#8599;</a>`:"")+
    `</div>`+
    `<div class="detail-body">`+
      `<div class="embed-card ${d.card||"is-mini"}"><iframe srcdoc="${srcdoc}" title="${i.t}" loading="lazy"></iframe></div>`+
      (d.url?`<p class="embed-note">Not loading? <a href="${d.url}" target="_blank" rel="noopener">Open ${d.openLabel||"the full calendar"} in a new tab <span aria-hidden="true">&#8599;</span></a></p>`:"")+
    `</div>`;
}

/* ---------- Financials ----------
   Eight years of department results, by course and combined. Baked in: these

const finYears = () => Object.keys(FIN_DATA).filter(y=>!FIN_HIDDEN[y]).sort();
const finFullYears = () => finYears().filter(y=>!FIN_PARTIAL[y]);
function finPick(){
  const ys=finYears();
  const y = (FIN_DATA[state.finYear] ? state.finYear : ys[ys.length-1]);

const finGet = (y,dept,key,seg) => ((FIN_DATA[y]||{})[dept]||{})[key]
  ? (FIN_DATA[y][dept][key][seg]||0) : 0;
const finTot = (y,key,seg) => finGet(y,"__total__",key,seg);

function finMoney(n){
  const s = n<0 ? "\u2212" : "";
  return s+"$"+Math.abs(Math.round(n)).toLocaleString();
}
function finNum(n){ return Math.round(n).toLocaleString(); }
function finCents(n){ return (n<0?"\u2212":"")+"$"+Math.abs(n).toFixed(2); }
/* Everything is signed so higher is better, so one rule colours every line. */
function finChg(now,then,asNum){
  const d=now-then;
  if(!then || Math.abs(d)<1) return `<span class="fin-chip">&mdash;</span>`;
  const pct=Math.abs(d/then)*100;
  const txt = asNum ? (d>0?"+":"\u2212")+finNum(Math.abs(d)) : (d>0?"+":"\u2212")+"$"+finNum(Math.abs(d));
  return `<span class="fin-chip ${d>0?"p":"m"}">${txt}</span>`+
    (pct<1000?`<div class="fin-pct">${d>0?"+":"\u2212"}${pct.toFixed(0)}%</div>`:"");
}

function finRatios(y,seg,prev){
  const rev=finTot(y,"rev",seg), lab=finTot(y,"lab",seg), cos=finTot(y,"cos",seg),
        noi=finTot(y,"noi",seg), rd=finTot(y,"rounds",seg);
  const pr={rev:finTot(prev,"rev",seg),lab:finTot(prev,"lab",seg),cos:finTot(prev,"cos",seg),
            noi:finTot(prev,"noi",seg),rd:finTot(prev,"rounds",seg)};
  const rows=[
    ["Operating margin", rev?noi/rev*100:0, pr.rev?pr.noi/pr.rev*100:0, "pct"],
    ["Labor as % of revenue", rev?lab/rev*100:0, pr.rev?pr.lab/pr.rev*100:0, "pct", true],
    ["Cost of sales as % of revenue", rev?cos/rev*100:0, pr.rev?pr.cos/pr.rev*100:0, "pct", true],
    ["Revenue per round", rd?rev/rd:0, pr.rd?pr.rev/pr.rd:0, "money"],
    ["Net operating income per round", rd?noi/rd:0, pr.rd?pr.noi/pr.rd:0, "money"],
  ];
  return rows.map(([name,now,then,kind,lowerBetter])=>{
    const d=now-then;
    const good = lowerBetter ? d<0 : d>0;
    const val = kind==="pct" ? now.toFixed(1)+"%" : "$"+now.toFixed(2);
    const mv  = kind==="pct" ? (d>0?"+":"\u2212")+Math.abs(d).toFixed(1)+" pts"
                             : (d>0?"+":"\u2212")+"$"+Math.abs(d).toFixed(2);
    return `<tr><td class="l">${name}</td><td><b>${val}</b></td>`+
      `<td>${!then?'<span class="fin-chip">&mdash;</span>':
        `<span class="fin-chip ${good?"p":"m"}">${mv}</span>`}</td></tr>`;
  }).join("");
}

/* What was going on each year. Every dip on the trend line has a cause, and a
   chart without them invites the wrong explanation. */
const FIN_NOTES = {
  "2018":"Major hail storm; general manager change.",
  "2019":"Clubhouse renovation at both courses following the hail storm.",
  "2020":"COVID-19 \u2014 no indoor dining permitted in the clubhouse.",
  "2022":"Peak of the post-COVID golf boom.",
  "2024":"Greens renovation at King & Bear \u2014 a long closure. Hurricanes Helene and Milton.",
  "2025":"Front-nine greens renovation at Slammer & Squire, January to June.",
};

const FIN_METRICS=[["rev","Revenue"],["cos","Cost of sales"],["lab","Labor"],
                   ["opx","Operating expenses"],["noi","Net operating income"]];
const FIN_LOWER_BETTER={cos:1,lab:1,opx:1};

/* One metric, one department, every year on record. */
function finVal(y,metric,dept,seg,perRound){
  const raw = dept==="__all__" ? finTot(y,metric,seg) : finGet(y,dept,metric,seg);
  if(!perRound) return raw;
  const rd=finTot(y,"rounds",seg);
  return rd ? raw/rd : 0;
}
function finTrend(seg,metric,dept,perRound){
  const ys=finFullYears();
  const vals=ys.map(y=>finVal(y,metric,dept,seg,perRound));
  const W=svgW(1), H=210, PL=46, PR=20, PB=28;
  /* Headroom has to be added, not multiplied: for a cost centre every value is
     negative, so max*1.1 lands BELOW the maximum and the line overflows the box. */
  const rawLo=Math.min.apply(null,vals), rawHi=Math.max.apply(null,vals);
  const span=(rawHi-rawLo)||Math.abs(rawHi)||1;
  const lo=rawLo-span*0.18, hi=rawHi+span*0.18;
  const x=i=>PL+i*((W-PL-PR)/Math.max(1,ys.length-1));
  const y=v=>H-PB-((v-lo)/Math.max(1,hi-lo))*(H-PB-16);
  const good = FIN_LOWER_BETTER[metric] ? (vals[vals.length-1]<vals[0]) : (vals[vals.length-1]>vals[0]);
  const stroke = good ? "#4c7a1a" : "var(--red)";
  let s=`<path d="${vals.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1)).join(" ")}" `+
        `fill="none" stroke="${stroke}" stroke-width="3" stroke-linejoin="round"></path>`;
  vals.forEach((v,i)=>{
    s+=`<circle cx="${x(i)}" cy="${y(v)}" r="${i===vals.length-1?5:3.5}" fill="${stroke}"></circle>`;
    const nt=FIN_NOTES[ys[i]];
    s+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="10" `+
       `fill="${nt?"var(--ink)":"#8a8a84"}" font-weight="${nt?700:400}">${ys[i].slice(2)}`+
       `${nt?'<tspan fill="var(--gold)" font-size="11">*</tspan>':""}</text>`;
  });
  [lo,(lo+hi)/2,hi].forEach(v=>{
    const lbl = perRound ? finCents(v).replace(/\.\d+$/,"") : (v<0?"\u2212":"")+"$"+(Math.abs(v)/1e6).toFixed(1)+"M";
    s+=`<text x="0" y="${y(v)+3}" font-size="9.5" fill="#b9b9b1">${lbl}</text>`;
    s+=`<line x1="${PL}" x2="${W-PR}" y1="${y(v)}" y2="${y(v)}" stroke="#f5f3ee"></line>`;
  });
  s+=`<text x="${x(vals.length-1)}" y="${y(vals[vals.length-1])-13}" text-anchor="end" `+
     `font-size="12" font-weight="700" fill="${stroke}">`+
     `${perRound?finCents(vals[vals.length-1]):finMoney(vals[vals.length-1])}</text>`;
  return {svg:`<svg class="fin-svg" viewBox="0 0 ${W} ${H}">${s}</svg>`,
          first:vals[0], last:vals[vals.length-1], vals, good, ys};
}

/* Reads the selected metric and department and says what is going well and what
   is not. Every claim is derived, so it moves when the numbers do. */
function finRead(seg,metric,dept){
  const ys=finFullYears(), a=ys[0], b=ys[ys.length-1], p=ys[ys.length-2];
  const lower=!!FIN_LOWER_BETTER[metric];
  const mname=(FIN_METRICS.find(m=>m[0]===metric)||["","" ])[1];
  const dname=dept==="__all__"?"the property":dept;
  const V=(y,c)=>finVal(y,metric,dept,c||seg,false);
  const PR=(y,c)=>finVal(y,metric,dept,c||seg,true);
  const rev=y=>dept==="__all__"?finTot(y,"rev",seg):finGet(y,dept,"rev",seg);
  const good=[], work=[];
  const pc=(x,y)=>y?((x-y)/Math.abs(y))*100:0;

  // long run
  const dLong=pc(V(b),V(a));
  const okLong = lower ? dLong<0 : dLong>0;
  (okLong?good:work).push(
    `${mname} ${dLong>=0?"rose":"fell"} <b>${Math.abs(dLong).toFixed(0)}%</b> at ${dname} between ${a} and ${b}`+
    `, ${finMoney(V(a))} to ${finMoney(V(b))}.`);

  // last year
  const dYr=pc(V(b),V(p));
  if(Math.abs(dYr)>=1){
    const okYr = lower ? dYr<0 : dYr>0;
    (okYr?good:work).push(
      `Against ${p} it ${dYr>=0?"rose":"fell"} <b>${Math.abs(dYr).toFixed(0)}%</b>.`);
  }

  // per round — does it still hold once volume is stripped out?
  const dPr=pc(PR(b),PR(a));
  const okPr = lower ? dPr<0 : dPr>0;
  (okPr?good:work).push(
    `Per round it went ${finCents(PR(a))} to <b>${finCents(PR(b))}</b> `+
    `(${dPr>=0?"+":"\u2212"}${Math.abs(dPr).toFixed(0)}%), so the move `+
    `${okPr===okLong?"holds up once rounds are taken out":"is partly a rounds story"}.`);

  // share of that department's own revenue
  if(metric!=="rev" && metric!=="noi" && rev(b)>0 && rev(a)>0){
    const sB=V(b)/rev(b)*100, sA=V(a)/rev(a)*100;
    const okShare=sB<sA;
    (okShare?good:work).push(
      `As a share of ${dname==="the property"?"revenue":dname+" revenue"} it is `+
      `<b>${sB.toFixed(1)}%</b>, against ${sA.toFixed(1)}% in ${a}.`);
  }

  // the two courses against each other
  if(seg==="all" && dept!=="Golf Academy"){
    const ss=V(b,"ss"), kb=V(b,"kb");
    if(ss&&kb){
      const gap=Math.abs(pc(kb,ss));
      if(gap>=8){
        const ahead = lower ? (kb<ss?"King & Bear":"Slammer & Squire")
                            : (kb>ss?"King & Bear":"Slammer & Squire");
        const behind = ahead==="King & Bear"?"Slammer & Squire":"King & Bear";
        work.push(`<b>${ahead}</b> is ${gap.toFixed(0)}% better than ${behind} on this measure `+
          `(${finMoney(ahead==="King & Bear"?kb:ss)} against ${finMoney(ahead==="King & Bear"?ss:kb)}) `+
          `\u2014 worth understanding why.`);
      }
    }
  }

  // best and worst year on record
  const series=ys.map(y=>({y,v:V(y)}));
  const best=series.reduce((x,z)=>((lower? z.v<x.v : z.v>x.v)?z:x));
  const worst=series.reduce((x,z)=>((lower? z.v>x.v : z.v<x.v)?z:x));
  const why = yy => FIN_NOTES[yy] ? ` ${FIN_NOTES[yy]}` : "";
  if(best.y!==b) work.push(`The best year on record is <b>${best.y}</b> at ${finMoney(best.v)}, not ${b}.${why(best.y)}`);
  else good.push(`${b} is the best year on record for this measure.${why(b)}`);
  if(worst.y===b) work.push(`${b} is the weakest year on record for this measure.${why(b)}`);
  else if(worst.y!==a) good.push(`The weakest year was <b>${worst.y}</b> at ${finMoney(worst.v)}.${why(worst.y)}`);

  if(dept==="Merchandise") work.push(`Note: merchandise revenue and cost of sales are separated `+
    `from Pro Shop, but its labor and operating costs are not \u2014 so this line is a gross margin, `+
    `not a full department result.`);
  return {good,work,mname,dname};
}

const FIN_KEYS=[["rev","Revenue"],["cos","Cost of sales"],["lab","Labor"],
                ["opx","Operating"],["noi","Net operating income"]];
const FIN_COSTS={cos:1,lab:1,opx:1};
const FIN_MODES=[["amt","Amount"],["chg","Change"],["per","Per round"],["pct","% of revenue"]];

/* One cell of the department matrix. The mode decides what it shows; cost
   columns colour the opposite way from revenue so a rising cost reads red. */
function finCell(y,p,dept,key,seg,mode){
  const at=(yy,k)=>dept==="__total__"?finTot(yy,k,seg):finGet(yy,dept,k,seg);
  const now=at(y,key), then=at(p,key);
  if(!now && !then) return '<span class="mx-dash">&mdash;</span>';
  if(mode==="amt") return finMoney(now);
  if(mode==="per"){ const rd=finTot(y,"rounds",seg); return rd?finCents(now/rd):'<span class="mx-dash">&mdash;</span>'; }
  if(mode==="pct"){
    const rev=at(y,"rev");
    if(!rev || key==="rev") return '<span class="mx-dash">&mdash;</span>';
    return (now/rev*100).toFixed(1)+"%";
  }
  const d=now-then;
  if(!then || Math.abs(d)<1) return '<span class="mx-dash">&mdash;</span>';
  const good = FIN_COSTS[key] ? d<0 : d>0;
  return `<span class="${good?"mx-pos":"mx-neg"}">${d>0?"+":"\u2212"}$${finNum(Math.abs(d))}`+
    `<span class="mx-sm">${d>0?"+":"\u2212"}${Math.abs(d/then*100).toFixed(0)}%</span></span>`;
}

/* The expanded row: one department, every bucket, four ways at once. */
function finDeptPanel(dept,y,p,seg,yLabel,prevLabel){
  const rd=finTot(y,"rounds",seg), rev=finGet(y,dept,"rev",seg);
  const rows=FIN_KEYS.map(([k,name])=>{
    const now=finGet(y,dept,k,seg), then=finGet(p,dept,k,seg), d=now-then;
    const good=FIN_COSTS[k]?d<0:d>0;
    return `<tr><td class="l">${name}</td><td data-l="${prevLabel}">${finMoney(then)}</td>`+
      `<td data-l="${yLabel}"><b>${finMoney(now)}</b></td>`+
      `<td data-l="Change" class="${then?(good?"mx-pos":"mx-neg"):""}">`+
      `${then?((d>0?"+":"\u2212")+"$"+finNum(Math.abs(d))):"&mdash;"}</td>`+
      `<td data-l="Per round">${rd?finCents(now/rd):"&mdash;"}</td>`+
      `<td data-l="% of revenue">${rev&&k!=="rev"?(now/rev*100).toFixed(1)+"%":"&mdash;"}</td></tr>`;
  }).join("");
  const parts=((FIN_DATA[y]||{})[dept]||{}).parts||{};
  let pt="";
  if(Object.keys(parts).length){
    pt=`<div class="mx-parts"><h6>Inside this department</h6><table class="mx-sub">`+
      `<tr><th class="l">&nbsp;</th><th>${prevLabel}</th><th>${yLabel}</th><th>Change</th></tr>`+
      Object.keys(parts).map(pn=>{
        const now=parts[pn][seg]||0, pp=(((FIN_DATA[p]||{})[dept]||{}).parts||{})[pn];
        const then=pp?(pp[seg]||0):null, d=then===null?null:now-then;
        return `<tr><td class="l">${pn}</td><td data-l="${prevLabel}">`+
          `${then===null?"&mdash;":finMoney(then)}</td>`+
          `<td data-l="${yLabel}"><b>${finMoney(now)}</b></td>`+
          `<td data-l="Change" class="${d===null?"":(d>0?"mx-pos":"mx-neg")}">`+
          `${d===null?"&mdash;":(d>0?"+":"\u2212")+"$"+finNum(Math.abs(d))}</td></tr>`;}).join("")+
      `</table></div>`;
  }
  return `<div class="mx-inner"><h5>${dept} &mdash; ${FIN_SEG[seg]}, ${yLabel}</h5><table class="mx-sub">`+
    `<tr><th class="l">&nbsp;</th><th>${prevLabel}</th><th>${yLabel}</th><th>Change</th>`+
    `<th>Per round</th><th>% of rev</th></tr>${rows}</table>${pt}</div>`;
}

const YD_DEPTS=["Pro Shop / Outside Serv","Merchandise","Restaurant","Beverage Cart","Food Truck",
  "Golf Course Maintenance","Golf Academy","General Administrative","Membership","Marketing"];
const YD_COST=/Employee Related|Operating Expenses|^COS|Cost of Sales/;
const YD_NOTE={"Membership":"split evenly between the courses",
  "Marketing":"split evenly between the courses",
  "Merchandise":"revenue and cost of sales only"};

function ydPick(l,seg){
  const g=(a,b)=>seg==="ss"?a:seg==="kb"?b:((a==null&&b==null)?null:(a||0)+(b||0));
  return [g(l[1],l[4]), g(l[2],l[5]), g(l[3],l[6])];
}
const ydMoney=n=>n==null?null:(n<0?"\u2212":"")+"$"+Math.abs(Math.round(n)).toLocaleString();
const ydNum=n=>n==null?null:Math.round(n).toLocaleString();

function ydVar(val,ref,isNum,goodUp){
  if(ref==null||val==null) return '<span class="yd-v yd-nil">&nbsp;</span>';
  const d=val-ref;
  if(!d) return '<span class="yd-v yd-nil">&mdash;</span>';
  const cls=(goodUp?d>0:d<0)?"yd-pos":"yd-neg";
  return `<span class="yd-v ${cls}">${d>0?"+":"\u2212"}`+
    `${isNum?ydNum(Math.abs(d)):"$"+ydNum(Math.abs(d))}</span>`;
}
/* three figure columns: prior with its variance beneath, actual, budget with its variance beneath */
function ydCells(a,p,b,isNum,goodUp){
  const f=x=>x==null?'<span class="yd-nil">&mdash;</span>':(isNum?ydNum(x):ydMoney(x));
  return `<div class="yd-u"><span class="yd-n">${f(p)}</span>${ydVar(a,p,isNum,goodUp)}</div>`+
    `<div class="yd-u yd-big"><span class="yd-n">${f(a)}</span>`+
      `<span class="yd-m">prior ${f(p)} &middot; budget ${f(b)}</span></div>`+
    `<div class="yd-u"><span class="yd-n">${f(b)}</span>${ydVar(a,b,isNum,goodUp)}</div>`;
}
function ydPanelRows(rows,seg){
  return rows.map(l=>{
    const [a,p,b]=ydPick(l,seg);
    return `<div class="yd-r yd-pl"><span class="yd-nm2">${l[0]}</span>`+
      ydCells(a,p,b,l[0]==="Rounds",!YD_COST.test(l[0]))+`</div>`;
  }).join("");
}

/* Line names read as labels in a table but not as subjects in a sentence. */
const YD_SAY={"Revenues":"Revenue","COS":"Cost of sales","Cost of Sales":"Cost of sales",
 "COS - Merchandise":"Merchandise cost of sales","Employee Related":"Labor",
 "Operating Expenses":"Operating expenses","Rev - Green Fees":"Green fees",
 "Rev - Cart Fee/Trail Fee":"Cart and trail fees","Rev - Handicap Fees/Other":"Handicap and other fees",
 "Rev - Merchandise":"Merchandise revenue","Revenues (Dues)":"Member dues",
 "Revenues(Dues)":"Member dues","Revenues (Initiation Fees)":"Initiation fees",
 "Revenues(Initiation Fees)":"Initiation fees","Resort Fee Revenue":"Resort fees"};
const ydName=l=>YD_SAY[l]||l;
const ydAbs=n=>"$"+Math.abs(Math.round(n)).toLocaleString();
const ydAbsN=n=>Math.abs(Math.round(n)).toLocaleString();

/* Everything here is derived, so it moves when the numbers do. */
function ydSay(seg,period,prevLabel,open){
  const P=YD[period]||{}, good=[], work=[];
  const push=(ok,t)=>(ok?good:work).push(t);
  const dn = open.indexOf("d:")===0 ? open.slice(2) : (open==="__rounds__" ? "Rounds" : null);

  if(dn && dn!=="Rounds"){
    const rows=(P.depts||{})[dn]||[];
    const noi=rows.find(l=>l[0]==="NOI");
    let revMissed=false;
    const rev=rows.find(l=>/^Revenues?$/.test(l[0])||l[0]==="Rev - Green Fees");
    if(rev){const [ra,,rb]=ydPick(rev,seg); if(ra!=null&&rb!=null&&ra<rb) revMissed=true;}
    if(noi){
      const [a,p,b]=ydPick(noi,seg);
      if(p!=null){const d=a-p; push(d>0,`Net operating income is <b>${finMoney(a)}</b>, `+
        `${d>0?"up":"down"} ${ydAbs(d)} on ${prevLabel}.`);}
      if(b!=null){const d=a-b; push(d>0,`That is ${ydAbs(d)} ${d>0?"ahead of":"behind"} budget.`);}
    }
    const scored=rows.filter(l=>l[0]!=="NOI").map(l=>{
      const [a,,b]=ydPick(l,seg);
      if(a==null||b==null) return null;
      const isCost=YD_COST.test(l[0]);
      const d=a-b;
      return {name:ydName(l[0]), d, isCost, ok:isCost?d<0:d>0, mag:Math.abs(d)};
    }).filter(Boolean).sort((x,y)=>y.mag-x.mag);
    if(scored[0]) push(scored[0].ok,
      `<b>${scored[0].name}</b> moved furthest from budget, by ${ydAbs(scored[0].d)}.`);
    const bad=scored.find(x=>!x.ok && (!scored[0]||x.name!==scored[0].name));
    if(bad) work.push(`<b>${bad.name}</b> is ${ydAbs(bad.d)} off budget.`);
    /* A cost under budget only because the revenue behind it never arrived is not
       an achievement, so it doesn't get listed as a win. */
    const win=scored.find(x=>x.ok && (!scored[0]||x.name!==scored[0].name) && !(x.isCost&&revMissed));
    if(win) good.push(`<b>${win.name}</b> beat budget by ${ydAbs(win.d)}.`);
    return {who:dn, good, work};
  }

  /* Rounds selected: the mix is the story. */
  if(dn==="Rounds"){
    const R=P.rounds;
    if(R){
      const T=ydPick(R.total,seg);
      if(T[1]!=null){const d=T[0]-T[1]; push(d>0,`Rounds are <b>${finNum(T[0])}</b>, `+
        `${d>0?"up":"down"} ${ydAbsN(d)} on ${prevLabel}.`);}
      if(T[2]!=null){const d=T[0]-T[2]; push(d>0,`That is ${ydAbsN(d)} ${d>0?"ahead of":"behind"} budget.`);}
      R.lines.forEach(l=>{
        const [a2,,b2]=ydPick(l,seg);
        if(a2==null||b2==null) return;
        const d=a2-b2;
        if(Math.abs(d) >= Math.max(300,(T[0]||0)*0.01))
          push(d>0,`<b>${l[0]}</b> rounds are ${ydAbsN(d)} ${d>0?"over":"under"} budget.`);
      });
    }
    return {who:"Rounds", good, work};
  }

  /* Nothing selected: the whole operation, top to bottom. */
  const t=k=>(P.totals||[]).find(l=>l[0]===k);
  const g=[], wk=[];
  const add=(ok,t2)=>(ok?g:wk).push(t2);
  const noi=t("NOI");
  if(noi){
    const [a2,p2,b2]=ydPick(noi,seg);
    if(p2!=null){const d=a2-p2; add(d>0,`Net operating income is <b>${finMoney(a2)}</b>, `+
      `${d>0?"up":"down"} ${ydAbs(d)} on ${prevLabel}.`);}
    if(b2!=null){const d=a2-b2; add(d>0,`NOI is ${ydAbs(d)} ${d>0?"ahead of":"behind"} budget.`);}
  }
  const rv2=t("Revenues");
  if(rv2){const [a2,,b2]=ydPick(rv2,seg);
    if(b2!=null){const d=a2-b2; add(d>0,`Revenue is ${ydAbs(d)} ${d>0?"over":"under"} plan.`);}}
  const lb=t("Employee Related");
  if(lb){const [a2,,b2]=ydPick(lb,seg);
    if(b2!=null){const d=a2-b2; add(d<0,`Labor is ${ydAbs(d)} ${d<0?"under":"over"} budget.`);}}
  if(P.rounds){
    const T=ydPick(P.rounds.total,seg);
    if(T[2]!=null){const d=T[0]-T[2]; add(d>0,`Rounds are ${ydAbsN(d)} ${d>0?"ahead of":"behind"} `+
      `budget at <b>${finNum(T[0])}</b>.`);}
  }
  /* which departments are carrying the result, and which are dragging it */
  const scored=YD_DEPTS.map(nm=>{
    const rows=(P.depts||{})[nm]; if(!rows) return null;
    const n2=rows.find(l=>l[0]==="NOI"); if(!n2) return null;
    const [a2,,b2]=ydPick(n2,seg);
    if(a2==null||b2==null) return null;
    return {nm, d:a2-b2};
  }).filter(Boolean).sort((x,y)=>y.d-x.d);
  if(scored.length){
    const best=scored[0], worst=scored[scored.length-1];
    if(best.d>0) g.push(`<b>${best.nm}</b> is furthest ahead of budget, by ${ydAbs(best.d)}.`);
    if(worst.d<0) wk.push(`<b>${worst.nm}</b> is furthest behind, by ${ydAbs(worst.d)}.`);
  }
  /* margin is context rather than a variance, so it only lands if there is room */
  if(noi && g.length<3){
    const rv3=t("Revenues");
    if(rv3){const [ra]=ydPick(rv3,seg), [na]=ydPick(noi,seg);
      if(ra) g.push(`Operating margin is <b>${(na/ra*100).toFixed(1)}%</b>.`);}
  }
  return {who: FIN_SEG[seg], good:g, work:wk};
  return {who: dn || FIN_SEG[seg], good, work};
}
function ydBand(seg,period,prevLabel){
  const S=ydSay(seg,period,prevLabel,state.finOpen||"");
  const li=a=>a.slice(0,3).map(t=>`<li>${t}</li>`).join("");
  return `<div class="yd-band"><div class="yd-band-top">`+
    `<span class="yd-band-t">What this says</span><span class="yd-band-w">${S.who}</span></div>`+
    `<div class="yd-band-cols">`+
      `<div class="yd-bc good"><h5><i></i>Working well</h5>`+
        (S.good.length?`<ul>${li(S.good)}</ul>`:`<p class="yd-none">Nothing stands out here.</p>`)+`</div>`+
      `<div class="yd-bc work"><h5><i></i>Room to improve</h5>`+
        (S.work.length?`<ul>${li(S.work)}</ul>`:`<p class="yd-none">No concerns here.</p>`)+`</div>`+
    `</div></div>`;
}

function detailYearReport(i,seg,period,prevLabel,periodLabel){
  const P=YD[period]||{};
  const open=state.finOpen||"";
  let h=ydBand(seg,period,prevLabel)+
    `<div class="yd-r yd-head"><span>&nbsp;</span><span>Prior year</span>`+
    `<span class="yd-a">Actual</span><span>Budget</span></div>`;

  if(P.rounds){
    const T=ydPick(P.rounds.total,seg);
    h+=`<div class="yd-grp${open==="__rounds__"?" open":""}">`+
      `<button type="button" class="yd-r" data-fopen="__rounds__">`+
        `<span class="yd-nm"><i class="yd-dot"></i>Rounds</span>`+ydCells(T[0],T[1],T[2],true,true)+
      `</button><div class="yd-panel">`+
      P.rounds.lines.map(l=>{
        const [a,p,b]=ydPick(l,seg);
        const sh=T[0]&&a!=null?`<span class="yd-side">${(a/T[0]*100).toFixed(0)}%</span>`:"";
        return `<div class="yd-r yd-pl"><span class="yd-nm2">${l[0]}${sh}</span>`+
          ydCells(a,p,b,true,true)+`</div>`;}).join("")+
      `</div></div>`;
  }

  YD_DEPTS.forEach(dn=>{
    const rows=(P.depts||{})[dn];
    if(!rows) return;
    const noi=rows.find(l=>l[0]==="NOI");
    const [a,p,b]=noi?ydPick(noi,seg):[null,null,null];
    const empty=!a&&!p&&!b;
    const inner=rows.filter(l=>l[0]!=="NOI");
    h+=`<div class="yd-grp${open==="d:"+dn?" open":""}">`+
      `<button type="button" class="yd-r" data-fopen="d:${dn}">`+
        `<span class="yd-nm"><i class="yd-dot"></i>${dn}`+
        `${YD_NOTE[dn]?`<span class="yd-note2">${YD_NOTE[dn]}</span>`:""}</span>`+
        (empty?`<div></div><div class="yd-u yd-big"><span class="yd-n yd-nil">not operated here</span></div><div></div>`
              :ydCells(a,p,b,false,true))+
      `</button>`+(empty?"":`<div class="yd-panel">${ydPanelRows(inner,seg)}</div>`)+`</div>`;
  });

  if(P.totals && P.totals.length){
    const tn=P.totals.find(l=>l[0]==="NOI");
    const TT=tn?ydPick(tn,seg):[null,null,null];
    h+=`<div class="yd-sub">${FIN_SEG[seg]} total</div>`+
      `<div class="yd-grp yd-grand open"><button type="button" class="yd-r">`+
      `<span class="yd-nm">Net operating income</span>`+ydCells(TT[0],TT[1],TT[2],false,true)+
      `</button><div class="yd-panel">`+
      ydPanelRows(P.totals.filter(l=>l[0]!=="NOI"),seg)+`</div></div>`;
  }
  return h;
}

/* The Annual Trend tab: the chart and the generated read-out. */
function ydTrendCards(seg){
  const ys=finFullYears();
  const metric = FIN_METRICS.some(m=>m[0]===state.finMetric)?state.finMetric:"noi";
  const dept = (state.finDept==="__all__"||FIN_DEPTS.indexOf(state.finDept)>-1)?state.finDept:"__all__";
  const per = state.finPer==="round";
  const T=finTrend(seg,metric,dept,per);
  const mname=(FIN_METRICS.find(m=>m[0]===metric)||[])[1];
  const d=T.last-T.first, pct=T.first?Math.abs(d/T.first)*100:0;

        (R.work.length?`<ul>${li(R.work)}</ul>`:`<p class="fin-none">No concerns on this measure.</p>`)+`</div>`+

}

function detailFinancials(i){
  const [y,seg,ys]=finPick();
  const isFirst = ys.indexOf(y)===0 && !FIN_PRIOR_OF[y];
  const prev = FIN_PRIOR_OF[y] ? FIN_PRIOR_OF[y] : (isFirst ? y : ys[ys.indexOf(y)-1]);
  const prevLabel = FIN_PARTIAL[prev] ? prev.replace(" YTD","")+" Jan\u2013Jun" : prev;
  const yLabel = FIN_PARTIAL[y] ? y.replace(" YTD","")+" Jan\u2013Jun" : y;
  const rev=finTot(y,"rev",seg), lab=finTot(y,"lab",seg), noi=finTot(y,"noi",seg);
  const pRev=finTot(prev,"rev",seg), pLab=finTot(prev,"lab",seg), pNoi=finTot(prev,"noi",seg);
  const margin=rev?noi/rev*100:0, pMargin=pRev?pNoi/pRev*100:0;

  const tab = state.finTab==="trend" ? "trend" : "year";   /* Year Detail is the landing view */
  /* Segment means the same thing on both tabs, so it sits above them and holds
     its value when you switch. Year and the metric pickers belong to one tab

/* Rainfall tab: one block per course, each a month header row, an AVG row and
   then a row per year. Blocks are found by the repeated month header. */
function buildRain(rows){
  const norm=v=>(v==null?"":String(v)).trim();
  const num=v=>{const n=parseFloat(norm(v)); return isNaN(n)?null:n;};
  const heads=[];
  rows.forEach((r,i)=>{
    const c=(r||[]).map(norm);
    if(c.indexOf("JAN")>0 && c.indexOf("DEC")>0) heads.push(i);
  });
  if(!heads.length) return null;
  const out={};
  heads.forEach((h,k)=>{
    const jan=(rows[h]||[]).map(norm).indexOf("JAN");
    const stop = k+1<heads.length ? heads[k+1] : rows.length;
    let avg=null; const years={}; let label="";
    for(let r=h+1;r<stop;r++){
      const row=rows[r]||[];
      const tag=norm(row[1]);
      const vals=[]; for(let m=0;m<12;m++) vals.push(num(row[jan+m]));
      if(norm(row[0])) label=norm(row[0]);
      if(/^AVG$/i.test(tag)) avg=vals;
      else if(/^\d{4}$/.test(tag)) years[tag]=vals;
    }
    if(!avg||!Object.keys(years).length) return;
    const key=/king/i.test(label)?"kb":/slammer/i.test(label)?"ss":(k===0?"ss":"kb");
    out[key]={avg:avg,years:years};
  });
  return (out.kb&&out.ss)?out:null;
}

/* Temperature tab: one block, Low/High pair per month. */
function buildTemps(rows){
  const norm=v=>(v==null?"":String(v)).trim();
  const num=v=>{const n=parseFloat(norm(v)); return isNaN(n)?null:n;};
  let mh=-1;
  rows.forEach((r,i)=>{ if(mh<0){ const c=(r||[]).map(norm);
    if(c.indexOf("JAN")>0 && c.indexOf("DEC")>0) mh=i; } });
  if(mh<0) return null;
  const jan=(rows[mh]||[]).map(norm).indexOf("JAN");
  let avg=null; const years={}; let station="";
  for(let r=mh+1;r<rows.length;r++){
    const row=rows[r]||[];
    const tag=norm(row[1]);
    if(norm(row[0])) station=norm(row[0]);
    const lo=[],hi=[];
    for(let m=0;m<12;m++){ lo.push(num(row[jan+2*m])); hi.push(num(row[jan+2*m+1])); }
    if(/^AVG$/i.test(tag)) avg=[lo,hi];
    else if(/^\d{4}$/.test(tag)) years[tag]=[lo,hi];
  }
  if(!avg||!Object.keys(years).length) return null;
  return {avg:avg, years:years, station:station||"World Golf Village"};
}

/* ---------- helpers ---------- */
const wxSum=a=>a.reduce((x,y)=>x+y,0);
const wxMean=a=>wxSum(a)/a.length;
const wxDone=a=>a.filter(x=>x!==null).length;
const wx1=n=>n.toFixed(1), wx2=n=>n.toFixed(2);
const WXNAME={kb:"King & Bear", ss:"Slammer & Squire"};

function wxMix(a,b,t){
  const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
  const [r1,g1,b1]=p(a),[r2,g2,b2]=p(b);
  const c=(x,y)=>Math.round(x+(y-x)*t).toString(16).padStart(2,"0");
  return "#"+c(r1,r2)+c(g1,g2)+c(b1,b2);
}
function wxInk(bg){
  const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
  const [r,g,b]=p(bg);
  return (r*299+g*587+b*114)/1000>150?"#17325a":"#fff";
}

/* Every headline number is derived, so it keeps up as rows are added. */
function wxFacts(){
  const D=WX_DATA, M=D.months, out={};
  ["kb","ss"].forEach(c=>{
    const B=D.rain[c], keys=Object.keys(B.years).sort();
    const latest=keys[keys.length-1], cur=B.years[latest], n=wxDone(cur);
    const ytd=wxSum(cur.slice(0,n)), norm=wxSum(B.avg.slice(0,n));
    const ranked=Object.keys(B.years)
      .filter(y=>B.years[y].slice(0,n).every(x=>x!==null))
      .map(y=>({y,t:wxSum(B.years[y].slice(0,n))})).sort((a,b)=>a.t-b.t);
    const prev=String(+latest-1);
    out[c]={latest,n,ytd,norm,diff:ytd-norm,pct:Math.round((ytd/norm-1)*100),
      rank:ranked.findIndex(r=>r.y===latest)+1, of:ranked.length,
      rankPrev:ranked.findIndex(r=>r.y===prev)+1,
      below:B.avg.slice(0,n).filter((a,m)=>cur[m]<a).length, thru:M[n-1]};
  });
  const T=D.temp, full=Object.keys(T.years).filter(y=>T.years[y][1].every(x=>x!==null)).sort();
  const cut=full[Math.floor(full.length/2)];
  const early=full.filter(y=>y<cut), late=full.filter(y=>y>=cut);
  out.hiShift = (early.length&&late.length)
    ? wxMean(late.map(y=>wxMean(T.years[y][1])))-wxMean(early.map(y=>wxMean(T.years[y][1]))) : 0;
  out.split=[early[0]+"\u2013"+early[early.length-1], late[0]+"\u2013"+late[late.length-1]];
  const keys=Object.keys(T.years).sort(), lat=T.years[keys[keys.length-1]], n=wxDone(lat[1]);
  out.hiNow = n ? wxMean(lat[1].slice(0,n))-wxMean(T.avg[1].slice(0,n)) : 0;
  const warm=full.map(y=>({y,t:wxMean(T.years[y][1])})).sort((a,b)=>b.t-a.t).slice(0,5);
  out.recentWarm=warm.filter(x=>+x.y>=2020).length;
  const A=D.rain.ss.avg, wet=[5,6,7,8];
  out.stormShare=Math.round(wxSum(wet.map(m=>A[m]))/wxSum(A)*100);
  return out;
}

/* charts are drawn at true pixel width, same as the survey chart */
function wxW(cols){ return svgW(cols||1); }

function wxAnnualRain(B){
  const yrs=Object.keys(B.years).sort(), norm=wxSum(B.avg);
  const W=wxW(2),H=176,PL=28,PB=22;
  const tot=yrs.map(y=>({y,t:wxSum(B.years[y].filter(x=>x!==null)),part:!B.years[y].every(x=>x!==null)}));
  const max=Math.max.apply(null,tot.map(t=>t.t).concat([norm]))*1.12;
  const bw=(W-PL)/yrs.length, y=v=>H-PB-(v/max)*(H-PB-8);
  let s="";
  tot.forEach((t,i)=>{
    const x=PL+i*bw, col=t.part?"#d9cfc2":(t.t>=norm?"var(--wet)":"var(--dry)");
    s+=`<rect x="${x+bw*.17}" y="${y(t.t)}" width="${bw*.66}" height="${H-PB-y(t.t)}" fill="${col}" rx="2"></rect>`;
    s+=`<text x="${x+bw/2}" y="${H-7}" text-anchor="middle" font-size="9" fill="#8a8a84">${t.y.slice(2)}</text>`;
  });
  s+=`<line x1="${PL}" x2="${W}" y1="${y(norm)}" y2="${y(norm)}" stroke="var(--navy)" stroke-width="1.5" stroke-dasharray="5 4"></line>`;
  s+=`<text x="${W}" y="${y(norm)-6}" text-anchor="end" font-size="10" font-weight="700" fill="var(--navy)">Normal ${Math.round(norm)}&Prime;</text>`;
  [0,Math.round(max/2/10)*10,Math.round(max/10)*10].forEach(v=>{
    s+=`<text x="0" y="${y(v)+3}" font-size="9.5" fill="#b9b9b1">${v}&Prime;</text>`; });
  return `<svg class="wx-svg" viewBox="0 0 ${W} ${H}">${s}</svg>`;
}
function wxMonthBars(B,latest){
  const cur=B.years[latest], W=wxW(2),H=160,PL=26,PB=22;
  const max=Math.max.apply(null,B.avg.concat(cur.filter(x=>x!==null)))*1.1;
  const bw=(W-PL)/12, y=v=>H-PB-(v/max)*(H-PB-8);
  let s="";
  for(let m=0;m<12;m++){
    const x=PL+m*bw;
    s+=`<rect x="${x+bw*.14}" y="${y(B.avg[m])}" width="${bw*.72}" height="${H-PB-y(B.avg[m])}" fill="#e9e6de" rx="2"></rect>`;
    if(cur[m]!==null) s+=`<rect x="${x+bw*.28}" y="${y(cur[m])}" width="${bw*.44}" height="${H-PB-y(cur[m])}" fill="var(--dry)" rx="2"></rect>`;
    s+=`<text x="${x+bw/2}" y="${H-7}" text-anchor="middle" font-size="10" fill="#8a8a84">${WX_DATA.months[m][0]}</text>`;
  }
  return `<svg class="wx-svg" viewBox="0 0 ${W} ${H}">${s}</svg>`;
}
function wxAnnualTemp(){
  const T=WX_DATA.temp, yrs=Object.keys(T.years).sort();
  const W=wxW(1),H=176,PL=26,PB=22;
  const pts=yrs.map(y=>{const v=T.years[y], n=wxDone(v[1]);
    return {y,hi:wxMean(v[1].slice(0,n)),lo:wxMean(v[0].slice(0,n)),part:n<12};});
  const all=pts.flatMap(p=>[p.hi,p.lo]);
  const lo=Math.min.apply(null,all)-3, hi=Math.max.apply(null,all)+3;
  const x=i=>PL+i*((W-PL)/Math.max(1,yrs.length-1)), y=v=>H-PB-((v-lo)/(hi-lo))*(H-PB-10);
  const line=k=>pts.map((p,i)=>(i?"L":"M")+x(i)+" "+y(p[k])).join(" ");
  let s=`<path d="${line("hi")}" fill="none" stroke="var(--hot)" stroke-width="2.5"></path>`;
  s+=`<path d="${line("lo")}" fill="none" stroke="var(--cold)" stroke-width="2.5"></path>`;
  pts.forEach((p,i)=>{
    s+=`<circle cx="${x(i)}" cy="${y(p.hi)}" r="3" fill="${p.part?"#d9cfc2":"var(--hot)"}"></circle>`;
    s+=`<circle cx="${x(i)}" cy="${y(p.lo)}" r="3" fill="${p.part?"#d9cfc2":"var(--cold)"}"></circle>`;
    s+=`<text x="${x(i)}" y="${H-7}" text-anchor="middle" font-size="9" fill="#8a8a84">${p.y.slice(2)}</text>`;
  });
  return `<svg class="wx-svg" viewBox="0 0 ${W} ${H}">${s}</svg>`;
}
function wxRainGrid(B){
  const M=WX_DATA.months, yrs=Object.keys(B.years).sort((a,b)=>b-a);
  let s='<div class="wx-scroll"><table class="wx-grid"><tr><th class="y"></th>'+
    M.map(m=>`<th>${m[0]}</th>`).join("")+'<th style="width:34px">Yr</th></tr>';
  yrs.forEach(y=>{
    const v=B.years[y], full=v.every(x=>x!==null);
    s+=`<tr><td class="y">${y}</td>`+v.map((x,m)=>{
      if(x===null) return '<td style="background:#f7f7f4"></td>';
      const d=Math.max(-1,Math.min(1,(x-B.avg[m])/Math.max(B.avg[m],.6)));
      const bg=d<0?wxMix("#ffffff","#a8571f",-d*.85):wxMix("#ffffff","#1f6fa8",d*.85);
      return `<td style="background:${bg};color:${wxInk(bg)}">${wx1(x)}</td>`;
    }).join("")+`<td class="y" style="font-size:9.5px">${full?Math.round(wxSum(v)):""}</td></tr>`;
  });
  s+='<tr class="avg"><td class="y">Norm</td>'+B.avg.map(a=>`<td>${wx1(a)}</td>`).join("")+
     `<td class="y" style="font-size:9.5px">${Math.round(wxSum(B.avg))}</td></tr></table></div>`;
  return s;
}
function wxTempGrid(idx){
  const T=WX_DATA.temp, M=WX_DATA.months, yrs=Object.keys(T.years).sort((a,b)=>b-a);
  const all=yrs.flatMap(y=>T.years[y][idx]).filter(x=>x!==null);
  const lo=Math.min.apply(null,all), hi=Math.max.apply(null,all);
  let s='<div class="wx-scroll"><table class="wx-grid"><tr><th class="y"></th>'+
    M.map(m=>`<th>${m[0]}</th>`).join("")+'</tr>';
  yrs.forEach(y=>{
    s+=`<tr><td class="y">${y}</td>`+T.years[y][idx].map(x=>{
      if(x===null) return '<td style="background:#f7f7f4"></td>';
      const bg=wxMix("#2a9d9b","#c8161d",(x-lo)/Math.max(1,hi-lo));
      return `<td style="background:${bg};color:${wxInk(bg)}">${x}</td>`;
    }).join("")+"</tr>";
  });
  s+='<tr class="avg"><td class="y">Norm</td>'+T.avg[idx].map(a=>`<td>${a}</td>`).join("")+'</tr></table></div>';
  return s;
}
