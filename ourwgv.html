<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WGV Staff Portal</title>
<style>
:root{
  --navy:#17325a; --navy-2:#22406c; --navy-3:#0f2544; --navy-line:#3a5a8a;
  --red:#c8161d; --red-dark:#a32d2d; --red-tint:#fbeceb; --red-wash:#fbf6f6;
  --ink:#17325a; --muted:#8a8a84; --line:#e5e2da; --line-soft:#f0eee8;
  --amber:#ba7517; --green:#639922;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink); background:#fff; font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{display:grid;grid-template-columns:236px minmax(0,1fr) 340px;height:100vh}

/* ---------- left rail ---------- */
.rail{background:var(--navy);color:#fff;padding:18px 14px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.brand-name{font-size:19px;font-weight:600;letter-spacing:1.5px;line-height:1}
.brand-sub{font-size:10px;color:#9fb4d4;letter-spacing:.7px;margin-top:3px}
.rail-select{background:var(--navy-2);border-radius:7px;padding:9px 11px;font-size:13px;
  display:flex;justify-content:space-between;align-items:center;width:100%;margin-bottom:8px}
.rail-stamp{background:var(--navy-2);border-radius:7px;padding:9px 11px;font-size:12px;color:#dbe5f2}
.rail-count{font-size:10px;color:#9fb4d4;letter-spacing:.8px;text-align:center;margin:8px 0 16px}
.nav-group{font-size:10px;letter-spacing:.8px;color:#7f97bd;padding:0 8px;margin:16px 0 6px}
.nav-item{display:flex;align-items:center;gap:9px;width:100%;padding:9px 9px;border-radius:7px;
  font-size:13px;border-left:3px solid transparent}
.nav-item:hover{background:var(--navy-2)}
.nav-item[aria-current="true"]{background:var(--navy-3);border-left-color:var(--red)}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.nav-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-count{font-size:12px;color:#9fb4d4}
.nav-item[aria-current="true"] .nav-count{color:#fff}
.rail-search{margin-top:18px}
.rail-search input{width:100%;background:var(--navy-2);border:0;border-radius:7px;padding:9px 11px;
  color:#fff;font:inherit;font-size:13px}
.rail-search input::placeholder{color:#9fb4d4}
.rail-foot{margin-top:22px;padding-top:14px;border-top:1px solid var(--navy-line);font-size:12px;color:#c7d5e8}
.rail-foot a{color:#fff;text-decoration:none;border-bottom:1px solid var(--navy-line)}
.rail-foot .txt-mgr{display:block;font-weight:600;color:#fff;margin-bottom:2px}

/* ---------- middle queue ---------- */
.queue{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;background:#fff}
.queue-head{padding:20px 22px 0;flex:none}
.queue-title{font-size:21px;font-weight:600;margin:0}
.queue-sub{font-size:13px;color:var(--muted);margin:4px 0 0}
.tabs{display:flex;gap:22px;margin-top:16px;border-bottom:1px solid var(--line)}
.tab{padding:0 0 10px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--red)}
.tab span{color:var(--muted);margin-left:5px}
.list{overflow-y:auto;flex:1}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:13px 22px;
  border-bottom:1px solid var(--line-soft);border-left:3px solid transparent}
.row:hover{background:#fafaf7}
.row[aria-current="true"]{background:var(--red-wash);border-left-color:var(--red)}
.row-icon{width:26px;height:26px;border-radius:6px;background:#f4f2ec;color:var(--muted);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:none}
.row-main{flex:1;min-width:0}
.row-title{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-meta{font-size:11px;color:var(--muted);margin-top:2px}
.row-side{text-align:right;flex:none}
.row-flag{font-size:13px;font-weight:600}
.row-age{font-size:11px;color:var(--muted);margin-top:2px}
.f-urgent{color:var(--red)} .f-high{color:var(--amber)} .f-low{color:var(--green)} .f-flat{color:var(--muted)}
.empty{padding:40px 22px;color:var(--muted);font-size:13px}

/* ---------- right detail ---------- */
.detail{background:var(--red-tint);padding:20px;overflow-y:auto}
.detail-title{font-size:19px;font-weight:600;margin:0}
.detail-id{font-size:14px;color:var(--red-dark);font-weight:500;margin-left:6px}
.detail-sub{font-size:12px;color:#7a4b4b;margin:5px 0 16px;line-height:1.5}
.card{background:#fff;border-radius:12px;padding:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--red-wash);border-radius:8px;padding:10px 11px}
.stat-k{font-size:10px;letter-spacing:.6px;color:var(--muted)}
.stat-v{font-size:19px;font-weight:600;margin-top:3px}
.stat-v small{font-size:11px;font-weight:400;color:var(--muted)}
.rows{margin-top:14px;font-size:13px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line-soft)}
.kv-k{color:var(--muted);flex:none}
.kv-v{text-align:right}
.pill{background:var(--red-tint);color:var(--red-dark);padding:3px 10px;border-radius:6px;font-size:12px;font-weight:500}
.pill-ok{background:#eaf3de;color:#3b6d11}
.note{padding:9px 0;border-bottom:1px solid var(--line-soft)}
.note .kv-k{display:block;margin-bottom:3px}
.fold{width:100%;display:flex;justify-content:space-between;align-items:center;padding:10px 0;
  border-bottom:1px solid var(--line-soft);font-size:13px}
.fold-tag{font-size:11px;color:var(--muted)}
.fold-body{font-size:12px;color:var(--muted);padding:0 0 10px;border-bottom:1px solid var(--line-soft);line-height:1.6}
.actions{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;text-align:center;padding:9px 10px;border-radius:8px;font-size:13px;font-weight:500}
.btn-primary{background:var(--red);color:#fff}
.btn-primary:hover{background:var(--red-dark)}
.btn-ghost{background:#fff;color:var(--ink);border:1px solid #eddad9}
.btn-ghost:hover{background:var(--red-wash)}

/* ---------- board view (staff hub) ---------- */
.board{padding:18px 22px 30px;overflow-y:auto}
.panel{border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.panel h3{margin:0 0 10px;font-size:15px;font-weight:600}
.panel p{margin:0 0 6px;font-size:13px;line-height:1.6}
.name-list{font-size:13px;line-height:1.9;color:#3f3f3b}
.name-list b{color:var(--ink);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--red-wash);color:var(--red-dark);border-radius:6px;padding:4px 10px;font-size:12px}
.chip-navy{background:#eef2f8;color:var(--navy)}

@media (max-width:1080px){
  .app{grid-template-columns:200px minmax(0,1fr) 300px}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr;height:auto}
  .rail{position:sticky;top:0;z-index:2}
  .queue{border-right:0;border-bottom:1px solid var(--line)}
  .list{max-height:none}
}
</style>
</head>

<div class="app">

  <!-- LEFT RAIL -->

    <div class="brand">

    <div class="rail-foot">
      <span class="txt-mgr">Text the manager</span>
      <a href="tel:9046647304">(904) 664-7304</a><br>

</div>

const el = s => document.querySelector(s);
const state = {view:"cart", tab:"open", item:null};

function navButton(n){
  return `<button class="nav-item" data-view="${n.id}" aria-current="false">
    <span class="dot" style="background:${n.dot}"></span>
    <span class="nav-label">${n.label}</span>
    <span class="nav-count">${countOf(n.id)}</span></button>`;
}
function countOf(id){ return DATA[id] ? DATA[id].open.length : ""; }

el("#navRequests").innerHTML = NAV.map(navButton).join("");
el("#navReference").innerHTML = REF.map(navButton).join("");
el("#railCount").textContent =
  NAV.reduce((s,n)=> s + (DATA[n.id] ? DATA[n.id].open.length : 0), 0) + " OPEN ITEMS · KB + SS";

document.querySelectorAll(".nav-item").forEach(b=>{
  b.addEventListener("click", ()=>{ state.view=b.dataset.view; state.tab="open"; state.item=null; render(); });
});
el("#tabs").addEventListener("click", e=>{
  const t = e.target.closest(".tab"); if(!t) return;
  state.tab = t.dataset.tab; state.item = null; render();
});

function render(){
  document.querySelectorAll(".nav-item").forEach(b=>
    b.setAttribute("aria-current", String(b.dataset.view === state.view)));

  if(state.view === "hub" || state.view === "contacts"){ renderBoard(); return; }
  el("#board").hidden = true; el("#list").hidden = false;
  el("#tabs").hidden = false;

  const meta = NAV.find(n=>n.id===state.view);
  el("#queueTitle").textContent = meta.title;
  el("#queueSub").textContent = meta.sub;
  const d = DATA[state.view];
  el("#cOpen").textContent = d.open.length;
  el("#cClosed").textContent = d.closed.length;
  document.querySelectorAll(".tab").forEach(t=>
    t.setAttribute("aria-selected", String(t.dataset.tab === state.tab)));

  const items = d[state.tab];
  if(!items.length){
    el("#list").innerHTML = `<div class="empty">Nothing here right now. Closed items land here once a request is marked complete.</div>`;
    el("#detail").innerHTML = ""; return;
  }
  if(!state.item || !items.find(i=>i.id===state.item)) state.item = items[0].id;

  el("#list").innerHTML = items.map(i=>`
    <button class="row" data-id="${i.id}" aria-current="${i.id===state.item}">
      <span class="row-icon">${i.site}</span>
      <span class="row-main">
        <span class="row-title">${i.t}</span>
        <span class="row-meta">#${i.id} · ${i.who}</span>
      </span>
      <span class="row-side">
        <span class="row-flag ${i.cls}">${i.flag}</span>
        <span class="row-age">${i.age}</span>
      </span>
    </button>`).join("");

  document.querySelectorAll(".row").forEach(r=>
    r.addEventListener("click", ()=>{ state.item = r.dataset.id; render(); }));

  renderDetail(items.find(i=>i.id===state.item));
}

function renderDetail(i){
  el("#detail").innerHTML = `
    <div class="detail-title">${i.t}<span class="detail-id">#${i.id}</span></div>
    <div class="detail-sub">${i.sub}</div>
    <div class="card">
      <div class="stats">
        ${i.stats.map(s=>`<div class="stat"><div class="stat-k">${s[0]}</div>
          <div class="stat-v" ${s[3]?'style="color:var(--red-dark)"':""}>${s[1]} ${s[2]?`<small>${s[2]}</small>`:""}</div></div>`).join("")}
      </div>
      <div class="rows">
        ${i.kv.map(k=>`<div class="kv"><span class="kv-k">${k[0]}</span>
          <span class="kv-v">${k[2]?`<span class="pill ${k[2]==="ok"?"pill-ok":""}">${k[1]}</span>`:k[1]}</span></div>`).join("")}
        <div class="note"><span class="kv-k">Notes</span>${i.note}</div>
        ${i.folds.map((f,n)=>`
          <button class="fold" data-fold="${n}" aria-expanded="false">
            <span>› ${f[0]}</span><span class="fold-tag">${f[1]}</span></button>
          <div class="fold-body" data-body="${n}" hidden>${f[2]}</div>`).join("")}
      </div>
      <div class="actions">
        <button class="btn btn-primary">Update status</button>
        <button class="btn btn-ghost">Reassign</button>
      </div>
    </div>`;
  document.querySelectorAll(".fold").forEach(f=>f.addEventListener("click",()=>{
    const body = document.querySelector(`[data-body="${f.dataset.fold}"]`);
    const open = body.hidden;
    body.hidden = !open;
    f.setAttribute("aria-expanded", String(open));
    f.firstElementChild.textContent = (open?"⌄ ":"› ") + f.firstElementChild.textContent.slice(2);
  }));
}

el("#q").addEventListener("input", e=>{
  const term = e.target.value.toLowerCase();
  document.querySelectorAll(".row").forEach(r=>{
    r.style.display = r.textContent.toLowerCase().includes(term) ? "" : "none";
  });
});

render();
</script>
