/* ---------- Customer Survey comments ----------
   Lives on its own tab. Fetched the first time someone opens the Comments
   view rather than on page load, since it's a few hundred rows.
   The Name / Phone number / Email columns are deliberately never read. */
const GID_COMMENTS = "1697333359";
let COMMENTS_DATA = null, COMMENTS_STATE = "idle";   // idle | loading | ready | failed

const CM_TAGS = [
  [/best part/i,                "Praise"],
  [/experience better/i,        "Suggestion"],
  [/staff members/i,            "Staff"],
  [/tee time reservation/i,     "Booking"],
];
const CM_LABEL = {Praise:"Praise", Suggestion:"Suggestions", Staff:"Staff shout-outs",
                  Booking:"Booking", Other:"Other"};

function cmTag(q){
  for(const [re,tag] of CM_TAGS) if(re.test(q||"")) return tag;
  return "Other";
}
function cmIso(s){
  const m=/^\s*(\d{1,2})\/(\d{1,2})\/(\d{4})\s*$/.exec(s||"");
  if(!m) return "";
  return m[3]+"-"+("0"+m[1]).slice(-2)+"-"+("0"+m[2]).slice(-2);
}
function cmPretty(iso){
  if(!iso) return "";
  const M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const p=iso.split("-");
  return M[(+p[1])-1]+" "+(+p[2])+", "+p[0];
}

/* Two blocks side by side, one per course. Block starts are found by looking
   for the repeated "Date" header, so an inserted column won't break it. */
function buildComments(rows){
  const norm=v=>(v==null?"":String(v)).trim();
  let hr=-1;
  for(let i=0;i<Math.min(rows.length,8);i++){
    const r=(rows[i]||[]).map(norm);
    if(r.indexOf("Date")>=0 && r.indexOf("Comment")>=0){ hr=i; break; }
  }
  if(hr<0) return null;
  const head=(rows[hr]||[]).map(norm);
  const starts=[];
  head.forEach((c,i)=>{ if(c==="Date") starts.push(i); });
  if(!starts.length) return null;

  const title=(rows[Math.max(0,hr-1)]||[]).map(norm);
  const out={kb:[],ss:[]};
  starts.forEach(s=>{
    let which="";
    for(let j=s;j>=Math.max(0,s-2);j--){
      if(/king/i.test(title[j]||"")) { which="kb"; break; }
      if(/slammer/i.test(title[j]||"")){ which="ss"; break; }
    }
    if(!which) which = starts.indexOf(s)===0 ? "kb" : "ss";
    for(let r=hr+1;r<rows.length;r++){
      const row=rows[r]||[];
      const text=norm(row[s+3]);                    // s+5,6,7 are name/phone/email
      if(!text) continue;
      out[which].push({d:cmIso(norm(row[s])), t:cmTag(norm(row[s+2])),
                       n:norm(row[s+4])||"Unknown", c:text});
    }
  });
  out.kb.sort((a,b)=>b.d<a.d?-1:b.d>a.d?1:0);
  out.ss.sort((a,b)=>b.d<a.d?-1:b.d>a.d?1:0);
  return (out.kb.length||out.ss.length) ? out : null;
}

function loadCommentsTab(then){
  if(COMMENTS_STATE==="loading") return;
  COMMENTS_STATE="loading";
  fetch(sheetCsvUrl(GID_COMMENTS),{cache:"no-store"})
    .then(r=>r.text()).then(t=>{
      const built=buildComments(parseCSV(t));
      if(built){ COMMENTS_DATA=built; COMMENTS_STATE="ready"; }
      else COMMENTS_STATE="failed";
      if(then) then();
    }).catch(()=>{ COMMENTS_STATE="failed"; if(then) then(); });
}

/* ---------- the shared course / view switch ---------- */
function svSwitch(){
  const NAME={kb:"King & Bear", ss:"Slammer & Squire"};
  return `<div class="svsw">`+["kb","ss"].map(c=>
    `<div class="svgrp"><div class="svgrp-lbl">${NAME[c]}</div><div class="svsplit">`+

      `${v==="scores"?"Scores":"Comments"}</button>`).join("")+
    `</div></div>`).join("")+`</div>`;
}
function svSwitchWire(i){
  el("#detail").querySelectorAll("[data-sv]").forEach(b=>b.addEventListener("click",()=>{

    if(p[0]===state.course && p[1]===state.svView) return;
    state.course=p[0]; state.svView=p[1]; state.cmShown=25;

/* ---------- comments view ---------- */
function cmFiltered(){
  const list=(COMMENTS_DATA&&COMMENTS_DATA[state.course])||[];
  const q=(state.cmQ||"").trim().toLowerCase();
  return list.filter(c=>
    (state.cmType==="all"||c.t===state.cmType) &&
    (state.cmNps==="all"||c.n===state.cmNps) &&
    (!q||c.c.toLowerCase().indexOf(q)>=0));
}

function cmRenderList(){
  const f=cmFiltered(), shown=state.cmShown||25, slice=f.slice(0,shown);
  const det=f.filter(c=>c.n==="Detractor").length;
  const cnt=el("#cmCount"), box=el("#cmList");
  if(!cnt||!box) return;
  cnt.textContent=f.length+(f.length===1?" comment":" comments")+(det?"  \u00b7  "+det+" from detractors":"");
  box.innerHTML = slice.length ? slice.map((c,i)=>
      `<div class="cm-card"><div class="cm-meta"><span class="cm-date">${cmPretty(c.d)}</span>`+
      `<span class="cm-pill cm-${c.n}">${c.n}</span>`+
      `<span class="cm-tag">${CM_LABEL[c.t]||c.t}</span></div>`+
      `<div class="cm-txt${c.c.length>320?" clip":""}" id="cmT${i}">${esc(c.c)}</div>`+
      (c.c.length>320?`<button type="button" class="cm-more" data-cmx="${i}">Read the rest</button>`:"")+
      `</div>`).join("")
      + (f.length>shown?`<button type="button" class="cm-showmore" id="cmMore">Show ${Math.min(25,f.length-shown)} more \u2014 ${f.length-shown} left</button>`:"")
    : `<div class="cm-empty">Nothing matches that. Try a different word or clear the filters.</div>`;
  box.querySelectorAll("[data-cmx]").forEach(b=>b.addEventListener("click",()=>{
    const t=el("#cmT"+b.dataset.cmx); if(t) t.classList.remove("clip");
    b.remove();
  }));
  const more=el("#cmMore");
  if(more) more.addEventListener("click",()=>{ state.cmShown=(state.cmShown||25)+25; cmRenderList(); });
}

function cmChips(){
  const list=(COMMENTS_DATA&&COMMENTS_DATA[state.course])||[];
  const kinds=["Praise","Suggestion","Staff","Booking","Other"].filter(k=>list.some(c=>c.t===k));
  const t=[`<button type="button" class="cm-chip" data-cmt="all" aria-pressed="${state.cmType==="all"}">All comments</button>`]
    .concat(kinds.map(k=>`<button type="button" class="cm-chip" data-cmt="${k}" aria-pressed="${state.cmType===k}">${CM_LABEL[k]}</button>`));
  const n=[`<button type="button" class="cm-chip" data-cmn="all" aria-pressed="${state.cmNps==="all"}">Everyone</button>`]
    .concat(["Promoter","Passive","Detractor"].map(k=>
      `<button type="button" class="cm-chip ${k==="Promoter"?"pro":k==="Detractor"?"det":""}" data-cmn="${k}" aria-pressed="${state.cmNps===k}">${k}s</button>`));
  return `<div class="cm-chips">${t.join("")}</div><div class="cm-chips">${n.join("")}</div>`;
}

function detailComments(i){
  const NAME={kb:"King & Bear", ss:"Slammer & Squire"};
  const head=`<div class="detail-head"><div class="detail-title">${i.t}</div>`+
    `<div class="detail-sub">What guests wrote, newest first.</div></div>`;

  if(COMMENTS_STATE!=="ready"){
    const msg = COMMENTS_STATE==="failed"
      ? "Comments aren't loading right now. Try again shortly."
      : "Loading comments\u2026";
    el("#detail").innerHTML=head+`<div class="detail-body">${svSwitch()}<p class="cm-empty">${msg}</p></div>`;
    svSwitchWire(i);
    if(COMMENTS_STATE==="idle") loadCommentsTab(()=>{
      const cur=(S[state.view]||{}).items||[];
      if((cur[state.idx]||{}).surveys && state.svView==="comments") detail(i);
    });
    return;
  }

  const all=COMMENTS_DATA[state.course]||[];
  const span=all.length?`${all.length} comments, ${cmPretty(all[all.length-1].d)} to ${cmPretty(all[0].d)}`:"No comments yet";
  el("#detail").innerHTML=
    `<div class="detail-head"><div class="detail-title">${i.t}</div>`+
    `<div class="detail-sub">${NAME[state.course]} \u2014 ${span}.</div></div>`+
    `<div class="detail-body is-wide">`+
      svSwitch()+
      `<div class="dt-cols"><div>`+
      `<div class="cm-tools">`+
        `<input class="cm-srch" id="cmQ" type="search" placeholder="Search comments \u2014 try bunkers, pace, cart, greens" value="${esc(state.cmQ||"")}">`+
        cmChips()+
      `</div>`+
      `<div class="cm-count" id="cmCount"></div>`+
      `</div><div><div id="cmList"></div></div></div>`+
    `</div>`;
  svSwitchWire(i);
  el("#detail").querySelectorAll("[data-cmt]").forEach(b=>b.addEventListener("click",()=>{
    state.cmType=b.dataset.cmt; state.cmShown=25; detail(i);
  }));
  el("#detail").querySelectorAll("[data-cmn]").forEach(b=>b.addEventListener("click",()=>{
    state.cmNps=b.dataset.cmn; state.cmShown=25; detail(i);
  }));
  const q=el("#cmQ");
  if(q) q.addEventListener("input",()=>{           // list only, so the box keeps focus
    state.cmQ=q.value; state.cmShown=25; cmRenderList();
  });
  cmRenderList();
}

const SURVEY_CATS = ["The Course","The Clubhouse","Food & Beverage",
  "Practice Facilities","The Golf Shop","The Course in General","Booking Experience"];

/* Reads the Surveys grid: each month is a five-column block laid out as
   Var | SS | Troon | KB | Var, so columns are found by the header row rather
   than by counting, and an inserted column won't throw the whole thing off. */
function buildSurveys(rows){
  const norm = v => (v==null?"":String(v)).trim();
  let hr = -1;
  for(let i=0;i<Math.min(rows.length,12);i++){
    const r=(rows[i]||[]).map(norm);
    if(r.indexOf("SS")>=0 && r.indexOf("Troon")>=0 && r.indexOf("KB")>=0){ hr=i; break; }
  }
  if(hr<0) return null;
  const head=(rows[hr]||[]).map(norm);
  const starts=[];
  head.forEach((c,i)=>{ if(c==="SS" && norm(head[i+1])==="Troon" && norm(head[i+2])==="KB") starts.push(i); });
  if(!starts.length) return null;

  const monthRow=(rows[hr-1]||[]).map(norm);
  const months=starts.map((s,k)=>{
    for(let j=s;j>=Math.max(0,s-3);j--){
      const m=/YTD\s+thru\s+([A-Za-z]{3})/i.exec(monthRow[j]||"");
      if(m) return m[1];
    }
    return "M"+(k+1);
  });
  const cell=(r,c)=>norm((rows[r]||[])[c]);
  const int=v=>{ const n=parseInt(String(v).replace(/[^0-9-]/g,""),10); return isNaN(n)?null:n; };
  const ser=(r,off)=>starts.map(s=>int(cell(r,s+off)));
  const pct=(r,off)=>starts.map(s=>cell(r,s+off));
  const label=r=>cell(r,0);
  const scoreRow=r=>starts.every(s=>{
    const a=cell(r,s), b=cell(r,s+1), c=cell(r,s+2);
    return a&&b&&c && ![a,b,c].some(x=>x.indexOf("%")>=0)
      && [a,b,c].every(x=>/^-?\d+$/.test(x));
  });

  let collectedRow=-1, npsRow=-1;
  for(let i=0;i<rows.length;i++){
    const L=label(i);
    if(collectedRow<0 && /total surveys/i.test(L)) collectedRow=i;
    if(npsRow<0 && /^how likely/i.test(L) && /world golf village/i.test(L)) npsRow=i;
  }
  if(npsRow<0) return null;

  const catRows=[];
  for(let i=0;i<rows.length;i++){
    const L=label(i);
    if(SURVEY_CATS.some(n=>n.toLowerCase()===L.toLowerCase())) catRows.push([i,L]);
  }
  if(!catRows.length) return null;

  const mix={};
  ["Detractor","Passive","Promoter"].forEach(k=>{
    for(let i=npsRow;i<Math.min(npsRow+6,rows.length);i++){
      if(label(i).toLowerCase()===k.toLowerCase()){
        mix[k]={ss:pct(i,0)[starts.length-1],troon:pct(i,1)[starts.length-1],kb:pct(i,2)[starts.length-1]};
        break;
      }
    }
    if(!mix[k]) mix[k]={ss:"",troon:"",kb:""};
  });

  const cats=catRows.map(([hrow,name],k)=>{
    const stop = k+1<catRows.length ? catRows[k+1][0] : rows.length;
    const qs=[];
    for(let r=hrow+1;r<stop;r++){
      if(label(r) && scoreRow(r)) qs.push({q:label(r),ss:ser(r,0),troon:ser(r,1),kb:ser(r,2)});
    }
    return {name:name,ss:ser(hrow,0),troon:ser(hrow,1),kb:ser(hrow,2),qs:qs};
  });

  return {
    months:months,
    collected:{ss:collectedRow<0?[]:ser(collectedRow,0), kb:collectedRow<0?[]:ser(collectedRow,2)},
    nps:{varSS:ser(npsRow,-1), ss:ser(npsRow,0), troon:ser(npsRow,1),
         kb:ser(npsRow,2), varKB:ser(npsRow,3)},
    mix:mix,
    cats:cats
  };
}

function loadSurveysTab(){
  if(!GID_SURVEYS) return;
  fetch(sheetCsvUrl(GID_SURVEYS),{cache:"no-store"})
    .then(r=>r.text()).then(t=>{
      const built=buildSurveys(parseCSV(t));
      if(!built || !built.cats.length) return;   // bad read: keep what we have
      SURVEY_DATA=built;
      const cur=(S[state.view]||{}).items||[];
      if((cur[state.idx]||{}).surveys) detail(cur[state.idx]);
    }).catch(()=>{});
}

/* "How likely is it that you would recommend..." is a net promoter question:
   it runs -100 to +100, unlike the 0-100 satisfaction indexes around it. */
function svIsNps(q){ return /^\s*how likely/i.test(q||""); }

function svLast(a){ return a && a.length ? a[a.length-1] : null; }
function svChip(v){
  if(v===null||isNaN(v)) return "";
  const c = v>0?"sv-up":v<0?"sv-dn":"sv-ev";
  return `<span class="sv-chip ${c}">${v>0?"+":""}${v}</span>`;
}

/* "Six months" has to keep up as rows are added each month. */
function svSpan(n){
  const w=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve"];
  const word=(n>0&&n<w.length)?w[n]:String(n);
  return word+" month"+(n===1?"":"s");
}

/* The chart is drawn at the width it will actually occupy. With a viewBox that
   matches the rendered pixels there's no rescaling, so labels stay true size on
   a phone instead of being squashed horizontally. */
function svgW(cols){
  const d=el("#detail");
  const pad = window.innerWidth<=820 ? 28 : 52;
  const inner = ((d?d.clientWidth:0) || 700) - pad;
  // Below the two-column breakpoint everything stays at reading width.
  if(window.innerWidth < 1180) return Math.max(280, Math.min(600, inner));
  const per = (cols===2) ? (inner-22)/2 : inner;
  return Math.max(280, Math.min(1000, per));
}
function svChart(me,tr){
  const all=me.concat(tr).filter(v=>v!==null);
  if(all.length<2) return "";
  const lo=Math.min.apply(null,all)-8, hi=Math.max.apply(null,all)+8;
  const W=svgW(2),H=196,PL=8,PR=8;
  const x=i=>PL+i*((W-PL-PR)/Math.max(1,me.length-1));
  const y=v=>H-24-((v-lo)/Math.max(1,hi-lo))*(H-46);
  const path=a=>a.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1)).join(" ");
  let back="";
  for(let i=me.length-1;i>=0;i--) back+="L"+x(i).toFixed(1)+" "+y(me[i]).toFixed(1)+" ";
  let s=`<path d="${path(tr)} ${back}Z" fill="var(--red)" opacity=".10"></path>`;
  s+=`<path d="${path(tr)}" fill="none" stroke="#b9b9b1" stroke-width="2" stroke-dasharray="5 4"></path>`;
  s+=`<path d="${path(me)}" fill="none" stroke="var(--red)" stroke-width="3" stroke-linejoin="round"></path>`;
  me.forEach((v,i)=>{ s+=`<circle cx="${x(i)}" cy="${y(v)}" r="${i===me.length-1?5:3.5}" fill="var(--red)"></circle>`; });
  (SURVEY_DATA.months||[]).forEach((m,i)=>{ s+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle" font-size="11" fill="#8a8a84">${m}</text>`; });
  s+=`<text x="${x(me.length-1)}" y="${y(svLast(me))-13}" text-anchor="end" font-size="12" font-weight="700" fill="var(--red)">${svLast(me)}</text>`;
  s+=`<text x="${x(tr.length-1)}" y="${y(svLast(tr))-11}" text-anchor="end" font-size="11" fill="#8a8a84">${svLast(tr)}</text>`;
  return `<svg class="sv-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${s}</svg>`;
}

function detailSurveys(i){
  const D=SURVEY_DATA||{}, c=(state.course==="ss")?"ss":"kb";
  const NAME={kb:"King & Bear", ss:"Slammer & Squire"};
  if(!D.cats||!D.cats.length){
    el("#detail").innerHTML=
      `<div class="detail-head"><div class="detail-title">${i.t}</div>`+
      `<div class="detail-sub">Survey numbers aren't loading right now. Try again shortly.</div></div>`;
    return;
  }
  const vs = c==="kb" ? D.nps.varKB : D.nps.varSS;
  const now=svLast(vs), then=vs[0];
  const mixRow=[["Promoter","var(--green)"],["Passive","#c9c5b8"],["Detractor","var(--red)"]];

  const cats=D.cats.map((cat,ci)=>{
    const sc=svLast(cat[c]), tr=svLast(cat.troon);
    const qs=cat.qs.map(q=>{
      const v=svLast(q[c])-svLast(q.troon);
      const nps=svIsNps(q.q);
      // an NPS answer isn't on the 0-100 scale, so it gets a tag instead of a bar
      const gauge = nps
        ? `<span class="sv-npstag">NPS</span>`
        : `<span class="sv-bar"><i style="width:${svLast(q[c])}%"></i><b style="left:${svLast(q.troon)}%"></b></span>`;
      return `<div class="sv-q"><span class="sv-qt">${q.q}</span>`+
        gauge+`<span class="sv-qn">${svLast(q[c])}</span>${svChip(v)}</div>`;
    }).join("");
    return `<div class="sv-cat" data-cat="${ci}"><button type="button" aria-expanded="false">`+
      `<span class="sv-cn">${cat.name}</span><span class="sv-cs">${sc}</span>${svChip(sc-tr)}`+
      `<span class="sv-chev">&#8250;</span></button><div class="sv-qs">${qs}</div></div>`;
  }).join("");

  el("#detail").innerHTML=
    `<div class="detail-head"><div class="detail-title">${i.t}</div>`+
    `<div class="detail-sub">2026 season, year to date through ${D.months?svLast(D.months):""} 30.</div></div>`+
    `<div class="detail-body is-wide">`+
      svSwitch()+
      `<div class="dt-cols"><div>`+
      `<div class="sv-gap">`+
        `<div class="sv-gaptop"><div>`+
          `<div class="sv-lbl">Gap to Troon average</div>`+
          `<div class="sv-num">${now>0?"+":""}${now}<small> pts</small></div>`+
        `</div><p class="sv-say">In ${D.months[0]} ${NAME[c]} sat <b>${then}</b> behind the Troon average. `+
        `${svSpan(D.months.length)} and <b>${svLast(D.collected[c])} surveys</b> later the gap is <b>${now}</b>.</p></div>`+
        svChart(D.nps[c], D.nps.troon)+
        `<div class="sv-legend"><span><i class="sv-key" style="background:var(--red)"></i>${NAME[c]}</span>`+
        `<span><i class="sv-key" style="background:#b9b9b1"></i>Troon average</span></div>`+
      `</div>`+
      `<div class="sv-tri">`+
        `<div class="sv-tile"><div class="sv-n">${svLast(D.nps[c])}</div>`+
          `<div class="sv-vs">Troon ${svLast(D.nps.troon)}</div>`+
          `<div class="sv-l">Net promoter score</div></div>`+
        `<div class="sv-tile"><div class="sv-n">${svLast(D.collected[c])}</div>`+
          `<div class="sv-vs">&nbsp;</div><div class="sv-l">Surveys in</div></div>`+
        `<div class="sv-tile"><div class="sv-n">${D.mix.Promoter[c]}</div>`+
          `<div class="sv-vs">Troon ${D.mix.Promoter.troon}</div>`+
          `<div class="sv-l">Promoters</div></div>`+
      `</div>`+
      `<h3 class="sv-h">Who is answering</h3>`+
      `<div class="sv-mix">`+mixRow.map(([k,col])=>{
        const p=parseFloat(D.mix[k][c])||0;
        // the detractor band is too narrow for a word, so the bands carry only
        // numbers and the key underneath does the naming
        return `<span style="width:${p}%;background:${col}" title="${k}: ${p}%">${p>=7?p+"%":""}</span>`;
      }).join("")+`</div>`+
      `<div class="sv-mixkey">`+mixRow.map(([k,col])=>
        `<span><i class="sv-mixdot" style="background:${col}"></i>${k}s `+
        `<b>${D.mix[k][c]}</b> <em>Troon ${D.mix[k].troon}</em></span>`).join("")+`</div>`+

      `</div><div>`+
      `<h3 class="sv-h">By area &mdash; tap to see the questions</h3>`+
      `${cats}`+
      `</div></div>`+
      `<p class="sv-foot">The grey marker on each bar is the Troon average for that question. `+
      `Figures come straight from Troon's survey reporting.</p>`+
    `</div>`;

  svSwitchWire(i);
  el("#detail").querySelectorAll(".sv-cat>button").forEach(b=>b.addEventListener("click",()=>{
    const open=b.parentNode.classList.toggle("open");
    b.setAttribute("aria-expanded",String(open));
  }));
}

/* ---------- one image per tab (e.g. Employee Parking Map) ---------- */
function detailImgTabs(i){
  const d=i.imgTabs||{};
  const tabs=d.tabs||[];
  if(!tabs.length) return;
  const n=Math.min(Math.max(state.park|0,0),tabs.length-1);
  const cur=tabs[n];
  el("#detail").innerHTML=
    `<div class="detail-head"><div class="detail-title">${i.t}</div>`+
    `<div class="detail-sub">${d.sub||"&nbsp;"}</div></div>`+
    `<div class="detail-body">`+
      `<div class="lang-switch wide">${tabs.map((t,x)=>`<button type="button" data-park="${x}" aria-pressed="${x===n}">${t[0]}</button>`).join("")}</div>`+
      `<div class="img-card is-tall"><img src="${cur[1]}" alt="${cur[2]||cur[0]}" `+
        `onerror="this.parentNode.innerHTML='<div class=\'doc-fallback\'>Map image not found. Check that '+this.getAttribute('src')+' sits beside ourwgv.html in the repo.</div>'"></div>`+
      `<p class="img-hint">Tap the image to view it full screen.</p>`+
    `</div>`;
  el("#detail").querySelectorAll("[data-park]").forEach(b=>b.addEventListener("click",()=>{
    state.park=+b.dataset.park;
    detail(i);
  }));
  const img=el("#detail").querySelector(".img-card img");
  if(img) img.addEventListener("click",()=>openLightbox(img.src,img.alt));
}

  const d=i.imgOnly||{};
  const head = d.url
    ? `<div class="detail-head has-open"><div class="dh-text"><div class="detail-title">${i.t}</div>`+

    : `<div class="detail-head"><div class="detail-title">${i.t}</div><div class="detail-sub">${d.sub||"&nbsp;"}</div></div>`;
  el("#detail").innerHTML=
    head+
    `<div class="detail-body">`+
      `<div class="img-card"><img src="${TROON_IMG[d.img]||d.img}" alt="${d.alt||i.t}"></div>`+
      `<p class="img-hint">Tap the image to view it full screen.</p>`+
      (d.url?`<div class="actions"><a class="btn btn-primary" href="${d.url}" target="_blank" rel="noopener">Open</a></div>`:"")+
    `</div>`;
  const img=el("#detail").querySelector(".img-card img");
  if(img) img.addEventListener("click",()=>openLightbox(img.src,img.alt));
}

function openLightbox(src,alt){
  closeLightbox();
  const box=document.createElement("div");
  box.id="lightbox";
  box.innerHTML=`<button class="lb-close" type="button" aria-label="Close">&times;</button><img src="${src}" alt="${alt||""}">`;
  box.addEventListener("click",closeLightbox);
  document.body.appendChild(box);
  document.addEventListener("keydown",lbKey);
}
function closeLightbox(){
  const b=document.getElementById("lightbox");
  if(b) b.remove();
  document.removeEventListener("keydown",lbKey);
}

const CART_CSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vSXWHwxyYwSBpwwF12kcfOcqX5-w2ePSmlKNOyethXluJH63to6Sq-Og7sBrxMyUbbbM5Nj9-Sc48aN/pub?gid=1748206187&single=true&output=csv";
const CART_LEARN="https://mailchi.mp/troon.com/turfsaver";
let cartLoaded=false;
function parseCSV(text){
  const rows=[]; let row=[],cur="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else { if(c==='"')q=true; else if(c===','){row.push(cur);cur="";} else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur="";} else if(c!=='\r')cur+=c; }
  }
  if(cur.length||row.length){row.push(cur);rows.push(row);}
  return rows.filter(r=>r.some(c=>c.trim()!==""));
}
function statusClass(rule){
  const r=(rule||"").toLowerCase();
  if(r.indexOf("clos")>-1||r.indexOf("maintenance")>-1) return "cc-closed";
  if(r.indexOf("path only")>-1||r.indexOf("caution")>-1||r.indexOf("90")>-1) return "cc-caution";
  return "cc-open";
}
function statusWord(rule){
  const r=(rule||"").toLowerCase();
  if(r.indexOf("clos")>-1||r.indexOf("maintenance")>-1) return "Closed";
  if(r.indexOf("path only")>-1||r.indexOf("caution")>-1) return "Caution";
  return "Open";
}
function renderCart(rows){
  const cells=[];
  rows.forEach(r=>r.forEach(c=>{ const v=(c||"").trim(); if(v) cells.push(v); }));
  const isCourse=s=>{const l=s.toLowerCase();return (l.indexOf("king")>-1&&l.indexOf("bear")>-1)||(l.indexOf("slammer")>-1&&l.indexOf("squire")>-1);};
  const label=s=>{const l=s.toLowerCase();return l.indexOf("king")>-1?"KING & BEAR":"SLAMMER & SQUIRE";};
  const isStatusWord=s=>/^(open|closed|caution|path only|cart path only)$/i.test(s.trim());
  const isUpdatedLabel=s=>/^updated/i.test(s.trim());
  const isTime=s=>/\b(am|pm)\b/i.test(s)||/\d{1,2}\/\d{1,2}/.test(s);
  const isLearn=s=>/learn about/i.test(s);
  const blocks=[];
  for(let i=0;i<cells.length;i++){
    if(!isCourse(cells[i])) continue;
    const b={name:label(cells[i]),status:"",rule:"",time:""};
    let j=i+1;
    while(j<cells.length && !isCourse(cells[j])){
      const c=cells[j];
      if(isLearn(c)){ j++; continue; }
      if(isStatusWord(c) && !b.status){ b.status=c; }
      else if(isUpdatedLabel(c)){ /* label only */ }
      else if(isTime(c) && !b.time){ b.time=c.replace(/updated as of:?/i,"").trim(); }
      else if(!b.rule){ b.rule=c; }
      j++;
    }
    blocks.push(b); i=j-1;
  }
  if(!blocks.length){
    document.getElementById("cartBody").innerHTML='<div class="cart-err"><b>Mapping needed.</b> First cells:<br><code>'+cells.slice(0,12).join("<br>")+'</code></div>';
    return;
  }
  function meta(b){
    const s=((b.status||"")+" "+(b.rule||"")).toLowerCase();
    if(s.indexOf("clos")>-1||s.indexOf("maintenance")>-1) return {word:"CLOSED",dot:"#c8161d",pillBg:"#c8161d",pillFg:"#fff",rowBg:"#fcf1f1"};
    if(s.indexOf("path only")>-1||s.indexOf("caution")>-1) return {word:"CAUTION",dot:"#ba7517",pillBg:"#fbeed4",pillFg:"#8a5a12",rowBg:"#fdf9f0"};
    return {word:"OPEN",dot:"#378add",pillBg:"#e6f1fb",pillFg:"#185fa5",rowBg:"#fff"};
  }
  function row(b,last){
    const m=meta(b);
    return '<div class="cart-row" style="background:'+m.rowBg+(last?"":";border-bottom:1px solid #eef0f4")+'">'+
      '<span class="cart-dot" style="background:'+m.dot+'"></span>'+
      '<div class="cart-mid"><div class="cart-course-name">'+b.name+'</div><div class="cart-rule-txt">'+(b.rule||b.status||"—")+'</div></div>'+
      '<div class="cart-right"><span class="cart-pill" style="background:'+m.pillBg+';color:'+m.pillFg+'">'+m.word+'</span>'+
      (b.time?'<div class="cart-time">'+b.time+'</div>':'')+'</div></div>';
  }
  document.getElementById("cartBody").innerHTML=
    '<div class="cart-rows">'+blocks.map((b,i)=>row(b,i===blocks.length-1)).join("")+'</div>'+
    '<div class="cart-learn"><a id="turfLink" href="#" onclick="goTurf(event)" class="'+(state.turf?"is-active":"")+'">Learn about TurfSaver entry-exit &rsaquo;</a></div>';
}

const WGV_EXEC="https://script.google.com/macros/s/AKfycbzdgGccH0kaXLUivz7EKYnT1vgHfY2Ixr1YvgqaLNlmc3rmTQYTwqLOqTVRKZLj1snYdg/exec";
const WGV_KEY="ourwgv_74df38d4f118eadaf22fef353e059caa";

// JSONP call (avoids CORS with Apps Script GET) — mirrors WasteNet's callback pattern.
function backendGet(params){
  return new Promise((resolve,reject)=>{
    const cb="wgvcb_"+Math.random().toString(36).slice(2);
    const q=Object.keys(params).map(k=>k+"="+encodeURIComponent(params[k])).join("&");
    const s=document.createElement("script");
    let done=false;
    window[cb]=(data)=>{ done=true; resolve(data); cleanup(); };
    function cleanup(){ try{ delete window[cb]; }catch(e){} if(s.parentNode) s.parentNode.removeChild(s); }
    s.onerror=()=>{ if(!done){ reject(new Error("network")); cleanup(); } };
    s.src=WGV_EXEC+"?key="+encodeURIComponent(WGV_KEY)+"&callback="+cb+(q?"&"+q:"");
    document.body.appendChild(s);
    setTimeout(()=>{ if(!done){ reject(new Error("timeout")); cleanup(); } }, 15000);
  });
}


/* ---- Content tab drives Announcements + Recognition (Type + Section) ---- */
const GID_CONTENT="1092396491";
let CONTENT={};   // key -> full row

function contentTypeToItem(row){
  const type=(row.type||"text").trim().toLowerCase();
  const base={ t:row.title||row.key, m:"", s:"", c:"f-flat", a:"", contentKey:row.key };
  if(type==="link") return Object.assign(base,{ linkOnly:true, d:{ sub:"Open this resource in a new tab.", url:(row.link||"").trim() } });
  if(type==="form") return Object.assign(base,{ d:{ sub:"Fill out and submit this form.", url:(row.link||"").trim() } });
  if(type==="pdf") return Object.assign(base,{ d:{ sub:"View or download the document.", url:(row.link||"").trim() } });
  return Object.assign(base,{ d:{ sub:"", rich:policyTextToHtml(row.body||"") } });  // text default
}

// Built-in announcement items that are NOT in the Content tab (forms/links kept in code).
function builtinAnnounceExtras(){
  return (S.__announceBuiltin||[]).slice();
}

function applyContent(rows){
  const hdr=(rows[0]||[]).map(x=>(x||"").trim().toLowerCase());
  const gi=n=>hdr.indexOf(n);
  const ki=gi("key"),ti=gi("title"),bi=gi("body"),tyi=gi("type"),li=gi("link"),si=gi("section");
  if(ki<0||ti<0) return;
  CONTENT={};
  const anns=[]; const recog={}; const reqs=[]; const res=[]; const mgmt=[];
  for(let i=1;i<rows.length;i++){
    const r=rows[i]||[];
    const key=(r[ki]||"").trim(); if(!key) continue;
    const section=(si>=0?(r[si]||""):"").trim(); if(!section) continue; // skips note row
    const row={ key, title:(r[ti]||"").trim(), body:(bi>=0?r[bi]:"")||"",
                type:(tyi>=0?r[tyi]:"")||"text", link:(li>=0?r[li]:"")||"", section };
    CONTENT[key]=row;
    const secl=section.toLowerCase();
    if(secl==="announcements") anns.push(row);
    else if(secl==="recognition") recog[key]=row;
    else if(secl==="requests / forms" || secl==="requests" || secl==="requests/forms") reqs.push(row);
    else if(secl==="resources") res.push(row);
    else if(secl==="management") mgmt.push(row);
  }

  // --- Announcements list = Content rows (in sheet order) + built-in extras (forms/links) ---
  if(anns.length){
    const contentTitles=anns.map(a=>(a.title||"").toLowerCase().trim());
    // These four are hard-coded and always sit at the top, in this order. Any
    // sheet row or snapshotted builtin with the same title is dropped so they
    // can't show up a second time further down the list.
    const annDrop = /^\s*(weather\s+stations?|work\s+schedule.*calendar|customer\s+surveys?|hours\s+of\s+operation|recent\s+member\s+emails?)\s*$/i;
    const extras=builtinAnnounceExtras().filter(x=>!annDrop.test((x.t||"").trim())
        && (x.imgOnly  // UKG flyer is always pinned
        || (contentTitles.indexOf((x.t||"").toLowerCase().trim())<0
        && !/verification of employment/i.test(x.t||""))));  // verification now comes from Content
    const annRows = anns.filter(r=>!annDrop.test((r.title||"").trim()));
    S.announce.items = [weatherItem(), calendarItem(), hoursItem(), memberEmailsItem()]
      .concat(annRows.map(contentTypeToItem)).concat(extras);
  }

  // --- Recognition list items filled by recogKey from Content ---
  if(S.recognition){
    S.recognition.items.forEach(it=>{
      if(!it.recogKey) return;
      const c=recog[it.recogKey];
      if(c){ if(c.title) it.t=c.title; it.d.rich=policyTextToHtml(c.body||""); }
    });
  }

  // --- Requests / Forms list from Content ---
  if(reqs.length && S.requests){
    // The tee sheet row keeps its position in the sheet but renders as an
    // embed instead of a plain link.
    const isTee = t=>/^\s*view\s+the\s+tee\s+sheet\s*$/i.test(t||"");
    S.requests.items = reqs.map(r=>isTee(r.title) ? teeSheetItem((r.title||"").trim()) : contentTypeToItem(r));
  }

  // --- Resources list from Content ---
  if(S.resources){
    // Handbook pinned first, Troon rows pinned last, sheet rows in between.
    // Sheet rows that duplicate a hard-coded row are dropped, as is Weather
    // Stations -- that one now lives at the top of Announcements.
    const drop = /^\s*(employee\s+handbook|employee\s+parking\s+map|weather\s+stations?|troon\s+values|troon\s+mission\s+and\s+vision)\s*$/i;
    const fromSheet = res.filter(r=>!drop.test((r.title||"").trim()));
    // Parking map sits directly under WGV Standards, or right after the
    // handbook if that row isn't in the sheet.
    const mid=[]; let placed=false;
    fromSheet.forEach(r=>{
      mid.push(contentTypeToItem(r));
      if(!placed && /^\s*wgv\s+standards\s*$/i.test((r.title||"").trim())){ mid.push(parkingItem()); placed=true; }
    });
    if(!placed) mid.unshift(parkingItem());
    S.resources.items = [handbookItem()].concat(mid).concat(troonItems());
  }

  // --- Management list from Content ---
  if(S.management){
    // Customer Surveys is hard-coded and pinned to the top; a duplicate sheet
    // row is dropped so it can't appear twice.
    const mgmtDrop = /^\s*(customer\s+surveys?|historical\s+weather|financials?)\s*$/i;
    const mgmtRows = mgmt.filter(r=>!mgmtDrop.test((r.title||"").trim()));
    S.management.items = [surveysItem(), histWeatherItem(), financialsItem()]
      .concat(mgmtRows.map(contentTypeToItem));
  }

  // TurfSaver content (if present as a Content row) powers the cart detail
  if(CONTENT["turfsaver"]) S.__policyRich=policyTextToHtml(CONTENT["turfsaver"].body||"");

  render();
}

const SHEET_PUB="https://docs.google.com/spreadsheets/d/e/2PACX-1vTBBK7rG2L3JQzI_3ntsTPvSJf8Jxeg3mNaf-dwtvmrEMUk5EgE4rmqKX3Mzs3GpcLNqXqpSGYDjnek/pub";
function sheetCsvUrl(gid){ return SHEET_PUB+"?output=csv&gid="+gid+"&single=true"; }
const GID_ANN="482646119", GID_POLICY="886204585";
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function buildPolicyRich(rows){
  // New format: entire policy lives in one cell (A1). rows[0][0] holds it.
  // Fallback: if it looks like the old 3-column layout, handle that too.
  let text="";
  if(rows && rows.length){
    // find the first non-empty cell anywhere (A1, or A2 if a header slipped in)
    for(let r=0;r<rows.length && !text;r++){
      for(let c=0;c<(rows[r]||[]).length && !text;c++){
        const v=(rows[r][c]||"").trim();
        if(v && v.toLowerCase()!=="section" && v.toLowerCase()!=="style" && v.toLowerCase()!=="content") text=rows[r][c];
      }
    }
  }
  if(!text) return "";
  return policyTextToHtml(text);
}

function esc2(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function policyTextToHtml(text){
  let t=String(text).replace(/\r/g,"");
  // Break mid-line bullets: a " -" that begins a new item (dash + space + capital, or dash right
  // after sentence punctuation) becomes its own line. Won't touch "50-100" (no space before dash).
  t=t.replace(/\s+-\s*(?=[A-Z])/g, "\n- ");
  // Also handle a dash at the very start after other text with no space marker already newline.
  const lines=t.split("\n");
  let html="", bullets=[];
  function flushBullets(){ if(bullets.length){ html+="<ul>"+bullets.map(b=>"<li>"+esc2(b)+"</li>").join("")+"</ul>"; bullets=[]; } }
  let para=[];
  function flushPara(){ if(para.length){ html+="<p>"+esc2(para.join(" "))+"</p>"; para=[]; } }
  for(let raw of lines){
    const line=raw.trim();
    if(!line){ flushPara(); flushBullets(); continue; }
    // bullet
    if(/^[-•]\s+/.test(line)){ flushPara(); bullets.push(line.replace(/^[-•]\s+/,"")); continue; }
    // heading: ALL CAPS (with some length) or ends with a colon and is short
    const isCaps = line.length>2 && line===line.toUpperCase() && /[A-Z]/.test(line);
    const isColonHead = /:$/.test(line) && line.length<=60 && line.split(" ").length<=8;
    if(isCaps || isColonHead){ flushPara(); flushBullets(); html+="<h4>"+esc2(line.replace(/:$/,""))+"</h4>"; continue; }
    para.push(line);
  }
  flushPara(); flushBullets();
  return html;
}

function applyAnnouncements(rows){
  // Guard: only proceed if the header row is actually the Announcements header.
  const hdr=(rows[0]||[]).map(x=>(x||"").trim().toLowerCase());
  if(hdr.indexOf("title")<0 || hdr.indexOf("type")<0){ return; }
  // header: Title, Type, Body / Description, Link, Show
  const items=[];
  for(let i=1;i<rows.length;i++){
    const [title,type,body,link,show]=rows[i];
    if(!title) continue;
    const tv=(type||"").trim().toLowerCase();
    if(["form","pdf","doc","link"].indexOf(tv)<0) continue;   // skip notes / non-data rows
    if((show||"").trim().toLowerCase()==="no") continue;
    const t=(type||"").trim().toLowerCase();
    if(t==="doc" || (link||"").indexOf("Tee Sheet Policy")>-1 || title.toLowerCase().indexOf("tee sheet policy")>-1){
      // policy item — rich content filled in later from the policy tab
      items.push({t:title.trim(), m:"", s:"", c:"f-flat", a:"", d:{sub:(body||"").trim(), rich:S.__policyRich||""}});
    } else if(t==="link"){
      items.push({t:title.trim(), m:"", s:"", c:"f-flat", a:"", linkOnly:true, d:{sub:(body||"").trim(), url:(link||"").trim()}});
    } else {
      items.push({t:title.trim(), m:"", s:"", c:"f-flat", a:"", d:{sub:(body||"").trim(), url:(link||"").trim()}});
    }
  }
  if(items.length){ S.announce.items=items; }
}

function loadLiveContent(){
  // Tee Sheet Policy first (so the announce item can embed its rich content)
  fetch(sheetCsvUrl(GID_POLICY),{cache:"no-store"}).then(r=>r.text()).then(t=>{
    const pr=buildPolicyRich(parseCSV(t)); if(pr) S.__policyRich=pr;
  }).catch(()=>{}).finally(()=>{

      applyAnnouncements(parseCSV(t));
      if(state.view==="announce") render();
    }).catch(()=>{});
  });
}
